<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">\
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Online</title>
    <!-- Thư viện PeerJS chính hãng -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden; /* Chống cuộn trang thừa */
    background-color: #111; /* Màu nền tối dịu mắt phù hợp không gian thiền */
    touch-action: manipulation; /* Tăng tốc độ phản hồi chạm, tránh hiện tượng zoom đúp */
}
canvas, .game-container {
    width: 100% !important;
    height: auto !important;
    max-height: 100vh;
    object-fit: contain;
}
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background: #111;
            font-family: 'Courier New', Courier, monospace;
            color: #fff;
            user-select: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        /* Màn hình tạo Avatar */
        #login-screen {
            position: absolute;
            inset: 0;
            background: rgba(15, 20, 15, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 15px;
        }
        #login-box {
            background: #232722;
            border: 3px solid #5c6b54;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        h2 {
            margin: 0 0 15px 0;
            text-align: center;
            color: #f4d03f;
            letter-spacing: 1px;
        }
        .creator-layout {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 18px;
        }
        .preview-box {
            width: 120px;
            height: 140px;
            background: #3a4f2c;
            border: 2px solid #6e8263;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .controls-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 13px;
        }
        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .opt-btn {
            background: #333a30;
            border: 1px solid #5c6b54;
            color: #ddd;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        .opt-btn.active {
            background: #d4af37;
            color: #111;
            font-weight: bold;
            border-color: #fff;
        }
        .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 2px solid #444;
            cursor: pointer;
        }
        .color-swatch.active {
            border-color: #fff;
            transform: scale(1.15);
        }
        input[type="text"] {
            width: 100%;
            background: #181b17;
            border: 1px solid #5c6b54;
            color: #fff;
            padding: 9px 12px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #f4d03f; }
        .start-btn {
            width: 100%;
            background: #4a7c36;
            border: 2px solid #7ab85c;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            margin-top: 10px;
        }
        .start-btn:hover { background: #5a9442; }

        /* UI trong game */
        #hud-top {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid #444;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
            pointer-events: none;
        }
        #ui-bottom {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 8px;
            background: rgba(15, 18, 15, 0.85);
            border: 1px solid #555;
            padding: 10px;
            border-radius: 10px;
            width: 92%;
            max-width: 500px;
        }
        #chat-input { flex: 1; }
        .action-btn {
            background: #8c6d1f;
            border: 1px solid #f4d03f;
            color: #fff;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            white-space: nowrap;
        }
        .action-btn.meditating {
            background: #2e7d32;
            border-color: #81c784;
        }
    </style>
</head>
<body>

    <!-- Màn hình tạo Avatar -->
    <div id="login-screen">
        <div id="login-box">
            <h2>THIỀN VIỆN TỐI GIẢN</h2>
            <div class="creator-layout">
                <div class="preview-box">
                    <canvas id="previewCanvas" width="100" height="110"></canvas>
                    <span style="font-size: 11px; color: #aaa; margin-top: 4px;">Xem trước</span>
                </div>
                <div class="controls-box">
                    <div class="control-row">
                        <span>Giới tính:</span>
                        <div class="btn-group" id="gender-group">
                            <button class="opt-btn active" onclick="setGender('male', this)">Nam</button>
                            <button class="opt-btn" onclick="setGender('female', this)">Nữ</button>
                        </div>
                    </div>
                    <div class="control-row">
                        <span>Màu da:</span>
                        <div class="btn-group" id="skin-group"></div>
                    </div>
                    <div class="control-row">
                        <span>Kiểu tóc:</span>
                        <div class="btn-group" id="hair-group"></div>
                    </div>
                    <div class="control-row">
                        <span>Trang phục:</span>
                        <div class="btn-group" id="outfit-group"></div>
                    </div>
                </div>
            </div>

            <div class="control-row">
                <span>Pháp danh / Tên hiển thị:</span>
                <input type="text" id="username-input" placeholder="Nhập tên của bạn..." maxlength="16" value="Hành Giả">
            </div>
            <button class="start-btn" onclick="joinGame()">BƯỚC VÀO THIỀN VIỆN</button>
        </div>
    </div>

    <!-- Hướng dẫn góc trái -->
    <div id="hud-top">
        <div><b>[W, A, S, D]</b> hoặc <b>[Mũi tên]</b>: Đi dạo</div>
        <div><b>[SPACE]</b>: Ngồi thiền kiết già / Đứng dậy</div>
        <div><b>[ENTER]</b>: Gõ chat trò chuyện</div>
        <div id="online-count" style="color: #81c784; margin-top: 4px;">● Đang kết nối phòng chung...</div>
    </div>

    <!-- Thanh chat & nút ngồi thiền -->
    <div id="ui-bottom">
        <input type="text" id="chat-input" placeholder="Nhập lời nhắn (Enter để gửi)..." maxlength="60" onkeydown="handleChatKey(event)">
        <button id="meditate-btn" class="action-btn" onclick="toggleMeditate()">🧘 Ngồi Thiền</button>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
// Cấu hình Avatar
const SKIN_COLORS = ['#ffdbac', '#f1c27d', '#e0ac69', '#c68642', '#8d5524'];
const HAIR_STYLES = {
    male: [{ id: 0, name: 'Đầu trọc' }, { id: 1, name: 'Tóc ngắn' }, { id: 2, name: 'Búi đỉnh' }],
    female: [{ id: 0, name: 'Búi củ tỏi' }, { id: 1, name: 'Tóc dài' }, { id: 2, name: 'Búi 2 bên' }]
};
const OUTFITS = {
    male: [
        { id: 0, name: 'Áo Lam', main: '#5c6bc0', trim: '#3949ab' },
        { id: 1, name: 'Áo Nâu', main: '#795548', trim: '#4e342e' },
        { id: 2, name: 'Cà Sa Vàng', main: '#e67e22', trim: '#d35400' },
        { id: 3, name: 'Áo Xám', main: '#78909c', trim: '#455a64' }
    ],
    female: [
        { id: 0, name: 'Áo Lam Nhạt', main: '#7986cb', trim: '#c5cae9' },
        { id: 1, name: 'Áo Tràng Nâu', main: '#8d6e63', trim: '#d7ccc8' },
        { id: 2, name: 'Áo Sen Hồng', main: '#d87093', trim: '#f8bbd0' },
        { id: 3, name: 'Áo Trắng Tinh', main: '#eceff1', trim: '#b0bec5' }
    ]
};

let avatarConfig = { gender: 'male', skin: SKIN_COLORS[0], hairStyle: 1, hairColor: '#222222', outfitId: 0 };

function initCreatorUI() {
    const skinGroup = document.getElementById('skin-group');
    SKIN_COLORS.forEach((color, idx) => {
        const div = document.createElement('div');
        div.className = 'color-swatch' + (idx === 0 ? ' active' : '');
        div.style.background = color;
        div.onclick = () => {
            avatarConfig.skin = color;
            document.querySelectorAll('#skin-group .color-swatch').forEach(el => el.classList.remove('active'));
            div.classList.add('active');
            renderPreview();
        };
        skinGroup.appendChild(div);
    });
    updateGenderOptions();
}

function setGender(gender, btn) {
    avatarConfig.gender = gender;
    avatarConfig.hairStyle = 0;
    avatarConfig.outfitId = 0;
    document.querySelectorAll('#gender-group .opt-btn').forEach(el => el.classList.remove('active'));
    btn.classList.add('active');
    updateGenderOptions();
}

function updateGenderOptions() {
    const hairGroup = document.getElementById('hair-group');
    hairGroup.innerHTML = '';
    HAIR_STYLES[avatarConfig.gender].forEach((h, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn' + (idx === avatarConfig.hairStyle ? ' active' : '');
        btn.innerText = h.name;
        btn.onclick = () => {
            avatarConfig.hairStyle = h.id;
            document.querySelectorAll('#hair-group .opt-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            renderPreview();
        };
        hairGroup.appendChild(btn);
    });

    const outfitGroup = document.getElementById('outfit-group');
    outfitGroup.innerHTML = '';
    OUTFITS[avatarConfig.gender].forEach((o, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn' + (idx === avatarConfig.outfitId ? ' active' : '');
        btn.innerText = o.name;
        btn.onclick = () => {
            avatarConfig.outfitId = o.id;
            document.querySelectorAll('#outfit-group .opt-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            renderPreview();
        };
        outfitGroup.appendChild(btn);
    });
    renderPreview();
}

function renderPreview() {
    const pCanvas = document.getElementById('previewCanvas');
    const pCtx = pCanvas.getContext('2d');
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    drawChibiCharacter(pCtx, 50, 82, '', avatarConfig, false, 0, '', 0, 1.4);
}

// Bản đồ phong cách RotMG
const MAP_WIDTH = 1600;
const MAP_HEIGHT = 1200;
const TEMPLE = { x: 520, y: 80, w: 560, h: 380 }; // Mở rộng Chánh điện cho tượng Phật lớn
const RIVER_Y = 740;
const RIVER_H = 110;
const BRIDGE = { x: 740, y: 730, w: 120, h: 130 };
const POND = { x: 1250, y: 480, r: 130 };

const TREES = [
    {x: 180, y: 200}, {x: 340, y: 160}, {x: 150, y: 450}, {x: 380, y: 520},
    {x: 1220, y: 180}, {x: 1440, y: 240}, {x: 1460, y: 630},
    {x: 220, y: 960}, {x: 480, y: 1040}, {x: 1120, y: 980}, {x: 1380, y: 1020}
];

const LOTUSES = [
    {x: 1210, y: 450}, {x: 1280, y: 430}, {x: 1300, y: 510},
    {x: 1200, y: 520}, {x: 1250, y: 480}
];

function drawMap(ctx, time) {
    const tileSize = 40;
    for (let y = 0; y < MAP_HEIGHT; y += tileSize) {
        for (let x = 0; x < MAP_WIDTH; x += tileSize) {
            const isAlt = ((x / tileSize) + (y / tileSize)) % 2 === 0;
            ctx.fillStyle = isAlt ? '#4e6b38' : '#476332';
            ctx.fillRect(x, y, tileSize, tileSize);
            if ((x * 7 + y * 13) % 5 === 0) {
                ctx.fillStyle = '#3a5227';
                ctx.fillRect(x + 12, y + 14, 4, 4);
            }
        }
    }

    // Đường đá dẫn lên Chánh điện
    ctx.fillStyle = '#8c7b65';
    ctx.fillRect(755, 460, 90, 660);

    // Sông
    ctx.fillStyle = '#2b7a9e';
    ctx.fillRect(0, RIVER_Y, MAP_WIDTH, RIVER_H);
    ctx.fillStyle = '#5bb5db';
    const waveOffset = Math.sin(time * 0.003) * 15;
    for (let wx = 40; wx < MAP_WIDTH; wx += 140) {
        ctx.fillRect(wx + waveOffset, RIVER_Y + 30, 35, 4);
    }

    // Cầu
    ctx.fillStyle = '#6d4c33';
    ctx.fillRect(BRIDGE.x, BRIDGE.y, BRIDGE.w, BRIDGE.h);

    // Hồ sen
    ctx.fillStyle = '#256d8c';
    ctx.beginPath();
    ctx.arc(POND.x, POND.y, POND.r, 0, Math.PI * 2);
    ctx.fill();
    LOTUSES.forEach(l => {
        ctx.fillStyle = '#388e3c';
        ctx.beginPath();
        ctx.arc(l.x, l.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f48fb1';
        ctx.beginPath();
        ctx.arc(l.x + 2, l.y - 2, 6, 0, Math.PI * 2);
        ctx.fill();
    });

    // Chánh điện
    ctx.fillStyle = '#a86b3e';
    ctx.fillRect(TEMPLE.x, TEMPLE.y, TEMPLE.w, TEMPLE.h);
    ctx.strokeStyle = '#5c3419';
    ctx.lineWidth = 8;
    ctx.strokeRect(TEMPLE.x, TEMPLE.y, TEMPLE.w, TEMPLE.h);
    ctx.fillStyle = '#4a2511';
    ctx.fillRect(TEMPLE.x, TEMPLE.y, TEMPLE.w, 22);
    ctx.fillRect(TEMPLE.x, TEMPLE.y, 22, TEMPLE.h);
    ctx.fillRect(TEMPLE.x + TEMPLE.w - 22, TEMPLE.y, 22, TEMPLE.h);

    // Vẽ TƯỢNG PHẬT NGỒI KIẾT GIÀ THẬT TO Ở CHÁNH ĐIỆN
    drawGiantBuddhaStatue(ctx, TEMPLE.x + TEMPLE.w / 2, TEMPLE.y + 135, time);

    // Các hàng bồ đoàn phía dưới tượng Phật
    ctx.fillStyle = '#6d4c41';
    for (let row = 0; row < 2; row++) {
        for (let col = 0; col < 5; col++) {
            const bx = TEMPLE.x + 110 + col * 85;
            const by = TEMPLE.y + 245 + row * 75;
            ctx.beginPath();
            ctx.ellipse(bx, by, 20, 13, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#d7ccc8';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    }

    // Cây
    TREES.forEach(t => {
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(t.x, t.y + 18, 22, 10, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(t.x - 6, t.y - 5, 12, 24);
        ctx.fillStyle = '#2e5a27';
        ctx.fillRect(t.x - 24, t.y - 36, 48, 32);
    });

    ctx.strokeStyle = '#1b2613';
    ctx.lineWidth = 16;
    ctx.strokeRect(0, 0, MAP_WIDTH, MAP_HEIGHT);
}

// Hàm vẽ Tượng Phật ngồi kiết già khổng lồ uy nghi trong Chánh điện
function drawGiantBuddhaStatue(ctx, bx, by, time) {
    ctx.save();
    ctx.translate(bx, by);

    // 1. Bệ thờ gỗ sơn son thếp vàng phía dưới
    ctx.fillStyle = '#5e1414';
    ctx.strokeStyle = '#d4af37';
    ctx.lineWidth = 3;
    ctx.fillRect(-95, 22, 190, 32);
    ctx.strokeRect(-95, 22, 190, 32);

    // 2. Vòng hào quang lớn tỏa sáng phía sau lưng tượng
    const glowRadius = 78 + Math.sin(time * 0.003) * 5;
    const grad = ctx.createRadialGradient(0, -35, 15, 0, -35, glowRadius);
    grad.addColorStop(0, 'rgba(255, 238, 88, 0.85)');
    grad.addColorStop(0.55, 'rgba(255, 193, 7, 0.45)');
    grad.addColorStop(1, 'rgba(255, 193, 7, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, -35, glowRadius, 0, Math.PI * 2);
    ctx.fill();

    // Vòng tròn hào quang viền vàng
    ctx.strokeStyle = 'rgba(255, 224, 130, 0.7)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, -38, 52, 0, Math.PI * 2);
    ctx.stroke();

    // 3. Tòa sen hồng lớn nâng đỡ tượng
    ctx.fillStyle = '#ec407a';
    ctx.strokeStyle = '#880e4f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 18, 62, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    // Cánh sen trang trí
    ctx.fillStyle = '#f48fb1';
    for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.ellipse(i * 20, 18, 12, 8, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // 4. Hai chân tượng ngồi kiết già vững chãi (tỉ lệ lớn)
    ctx.fillStyle = '#f39c12'; // Y vàng cam
    ctx.strokeStyle = '#7e5109';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(-52, -4, 104, 22, 11);
    ctx.fill();
    ctx.stroke();

    // Hai bàn chân ngửa đặt trên đùi kiết già
    ctx.fillStyle = '#ffd54f'; // Da tượng thếp vàng
    ctx.beginPath();
    ctx.ellipse(-20, 5, 13, 6, -0.15, 0, Math.PI * 2);
    ctx.ellipse(20, 5, 13, 6, 0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 5. Thân tượng & Áo cà sa vắt chéo vai
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.roundRect(-32, -48, 64, 46, 12);
    ctx.fill();
    ctx.stroke();

    // Nếp áo cà sa vắt chéo từ vai trái xuống hông phải
    ctx.fillStyle = '#d35400';
    ctx.beginPath();
    ctx.moveTo(-30, -46);
    ctx.lineTo(28, -4);
    ctx.lineTo(14, -4);
    ctx.lineTo(-30, -32);
    ctx.closePath();
    ctx.fill();

    // Phần ngực vàng lộ ra bên vai phải
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.moveTo(4, -46);
    ctx.lineTo(28, -46);
    ctx.lineTo(28, -24);
    ctx.closePath();
    ctx.fill();

    // 6. Hai cánh tay buông từ vai xuống & Hai bàn tay kết ấn thiền định
    ctx.fillStyle = '#f39c12';
    ctx.fillRect(-38, -42, 10, 32); // Tay trái
    ctx.strokeRect(-38, -42, 10, 32);
    ctx.fillRect(28, -42, 10, 32);  // Tay phải
    ctx.strokeRect(28, -42, 10, 32);

    // Cẳng tay gập vào giữa bụng
    ctx.fillRect(-36, -16, 72, 10);
    ctx.strokeRect(-36, -16, 72, 10);

    // Hai bàn tay thủ ấn đặt chồng lên nhau
    ctx.fillStyle = '#ffd54f';
    ctx.beginPath();
    ctx.ellipse(0, -11, 14, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // 7. Đầu tượng Phật uy nghi
    // Tai dài chạm vai
    ctx.fillStyle = '#ffd54f';
    ctx.fillRect(-25, -76, 5, 16);
    ctx.fillRect(20, -76, 5, 16);

    // Khuôn mặt tròn đầy
    ctx.beginPath();
    ctx.roundRect(-21, -86, 42, 38, 14);
    ctx.fill();
    ctx.stroke();

    // Tóc xoắn ốc xanh đen & Nhục kế trên đỉnh đầu
    ctx.fillStyle = '#1c2833';
    ctx.beginPath();
    ctx.roundRect(-21, -90, 42, 12, 6);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -93, 9, 0, Math.PI * 2); // Nhục kế
    ctx.fill();

    // Bạch hào (chấm sáng giữa trán)
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -75, 2, 0, Math.PI * 2);
    ctx.fill();

    // Đôi mắt khép hờ từ bi & Nụ cười thanh tịnh
    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-9, -68, 4, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(9, -68, 4, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(0, -58, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();

    ctx.restore();
}

// ==========================================
// VẼ NHÂN VẬT (ĐI ĐỨNG & NGỒI KIẾT GIÀ RÕ ĐẦU - THÂN - TAY - CHÂN)
// ==========================================
function drawChibiCharacter(ctx, x, y, name, cfg, meditating, walkPhase, chat, time, scale = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);

    const outfitList = OUTFITS[cfg.gender] || OUTFITS.male;
    const outfit = outfitList[cfg.outfitId] || outfitList[0];

    // Bóng đổ dưới đất
    ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
    ctx.beginPath();
    ctx.ellipse(0, 14, meditating ? 19 : 12, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    if (meditating) {
        // 1. Hào quang đom đóm phát sáng dịu nhẹ quanh toàn thân
        const pulse = 0.55 + Math.sin(time * 0.005) * 0.25;
        const radius = 32 + Math.sin(time * 0.004) * 4;
        const grad = ctx.createRadialGradient(0, -4, 4, 0, -4, radius);
        grad.addColorStop(0, `rgba(255, 245, 157, ${pulse})`);
        grad.addColorStop(0.6, `rgba(174, 234, 0, ${pulse * 0.45})`);
        grad.addColorStop(1, 'rgba(255, 245, 157, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, -4, radius, 0, Math.PI * 2);
        ctx.fill();

        // Đom đóm li ti bay quanh
        for (let i = 0; i < 4; i++) {
            const angle = time * 0.002 + i * (Math.PI / 2);
            const fx = Math.cos(angle) * 22;
            const fy = -8 + Math.sin(angle * 1.5) * 10;
            ctx.fillStyle = '#fff59d';
            ctx.fillRect(fx, fy, 2.5, 2.5);
        }

        // 2. CHÂN NGỒI KIẾT GIÀ RÕ RÀNG (Hai đầu gối mở rộng sang 2 bên, 2 bàn chân vắt chéo)
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1.5;

        // Đùi/ống chân xếp bằng rộng sang hai bên
        ctx.fillStyle = outfit.trim;
        ctx.beginPath();
        ctx.roundRect(-17, 4, 34, 9, 4.5);
        ctx.fill();
        ctx.stroke();

        // Đường gấp nếp chân chéo nhau ở giữa
        ctx.beginPath();
        ctx.moveTo(-6, 4);
        ctx.lineTo(6, 13);
        ctx.stroke();

        // Hai bàn chân ngửa đặt lên đùi đối diện
        ctx.fillStyle = cfg.skin;
        ctx.beginPath();
        ctx.ellipse(-8, 7, 4.5, 2.5, -0.2, 0, Math.PI * 2);
        ctx.ellipse(8, 7, 4.5, 2.5, 0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // 3. THÂN ÁO NGỒI THẲNG LƯNG
        ctx.fillStyle = outfit.main;
        ctx.beginPath();
        ctx.roundRect(-10, -10, 20, 15, 3);
        ctx.fill();
        ctx.stroke();

        // Cổ áo chữ V
        ctx.fillStyle = outfit.trim;
        ctx.beginPath();
        ctx.moveTo(-4, -10);
        ctx.lineTo(4, -10);
        ctx.lineTo(0, -4);
        ctx.closePath();
        ctx.fill();

        // 4. HAI CÁNH TAY & BÀN TAY THỦ ẤN THIỀN ĐỊNH TRƯỚC BỤNG
        ctx.fillStyle = outfit.main;
        // Cánh tay trái & phải buông từ vai xuống khuỷu tay
        ctx.fillRect(-13, -8, 4, 10);
        ctx.strokeRect(-13, -8, 4, 10);
        ctx.fillRect(9, -8, 4, 10);
        ctx.strokeRect(9, -8, 4, 10);

        // Cẳng tay gập ngang vào trước bụng
        ctx.fillRect(-12, -1, 24, 4);
        ctx.strokeRect(-12, -1, 24, 4);

        // Hai bàn tay đan vào nhau đặt giữa lòng (Thủ ấn)
        ctx.fillStyle = cfg.skin;
        ctx.beginPath();
        ctx.roundRect(-5, -2, 10, 5, 2);
        ctx.fill();
        ctx.stroke();

        // 5. ĐẦU TO TỈ LỆ CHIBI (Mắt nhắm an tịnh)
        drawChibiHead(ctx, 0, -21, cfg, true);

    } else {
        // --- TƯ THẾ ĐI ĐỨNG ---
        const bobY = Math.abs(Math.sin(walkPhase)) * -2.5;
        const leftLegY = Math.sin(walkPhase) * 4;
        const rightLegY = -Math.sin(walkPhase) * 4;

        // Hai chân bước qua lại
        ctx.fillStyle = '#222';
        ctx.fillRect(-7, 6 + leftLegY, 5, 8);
        ctx.fillRect(2, 6 + rightLegY, 5, 8);

        // Thân áo
        ctx.fillStyle = outfit.main;
        ctx.fillRect(-9, -8 + bobY, 18, 16);
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-9, -8 + bobY, 18, 16);

        // Hai tay buông tự nhiên hai bên thân
        ctx.fillStyle = outfit.main;
        ctx.fillRect(-12, -7 + bobY, 3, 12);
        ctx.strokeRect(-12, -7 + bobY, 3, 12);
        ctx.fillRect(9, -7 + bobY, 3, 12);
        ctx.strokeRect(9, -7 + bobY, 3, 12);

        // Đầu to ngộ nghĩnh
        drawChibiHead(ctx, 0, -21 + bobY, cfg, false);
    }

    // --- TÊN NHÂN VẬT & BONG BÓNG CHAT ---
    if (name) {
        const nameY = meditating ? -39 : -41;
        ctx.font = 'bold 12px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 3;
        ctx.strokeText(name, 0, nameY);
        ctx.fillStyle = '#ffeb3b';
        ctx.fillText(name, 0, nameY);

        if (chat) {
            ctx.font = '12px "Courier New", monospace';
            const textWidth = ctx.measureText(chat).width;
            const boxW = Math.max(textWidth + 16, 40);
            const boxH = 22;
            const boxY = nameY - 34;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(-boxW / 2, boxY, boxW, boxH, 5);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#111';
            ctx.fillText(chat, 0, boxY + 15);
        }
    }

    ctx.restore();
}

function drawChibiHead(ctx, hx, hy, cfg, eyesClosed) {
    ctx.save();
    ctx.translate(hx, hy);
    ctx.fillStyle = cfg.skin;
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-12, -11, 24, 22, 6);
    ctx.fill();
    ctx.stroke();

    // Tóc đầy đủ các kiểu cho Nam và Nữ
    ctx.fillStyle = cfg.hairColor;
    if (cfg.gender === 'male') {
        if (cfg.hairStyle === 1) { // Tóc ngắn
            ctx.fillRect(-12, -12, 24, 7);
            ctx.fillRect(-12, -8, 3, 6);
            ctx.fillRect(9, -8, 3, 6);
        } else if (cfg.hairStyle === 2) { // Búi đỉnh
            ctx.beginPath();
            ctx.arc(0, -14, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-10, -11, 20, 4);
        }
    } else {
        if (cfg.hairStyle === 0) { // Búi củ tỏi
            ctx.beginPath();
            ctx.arc(0, -15, 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-12, -11, 24, 6);
        } else if (cfg.hairStyle === 1) { // Tóc dài
            ctx.fillRect(-13, -11, 26, 7);
            ctx.fillRect(-14, -6, 4, 18);
            ctx.fillRect(10, -6, 4, 18);
        } else if (cfg.hairStyle === 2) { // Búi 2 bên
            ctx.beginPath();
            ctx.arc(-11, -12, 5, 0, Math.PI * 2);
            ctx.arc(11, -12, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(-11, -11, 22, 6);
        }
    }

    if (eyesClosed) {
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-7, 0); ctx.lineTo(-3, 0);
        ctx.moveTo(3, 0); ctx.lineTo(7, 0);
        ctx.stroke();
    } else {
        ctx.fillStyle = '#111';
        ctx.fillRect(-7, -2, 4, 5);
        ctx.fillRect(3, -2, 4, 5);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-6, -1, 1.5, 1.5);
        ctx.fillRect(4, -1, 1.5, 1.5);
    }

    if (cfg.gender === 'female') {
        ctx.fillStyle = 'rgba(255, 105, 135, 0.45)';
        ctx.fillRect(-9, 3, 4, 2.5);
        ctx.fillRect(5, 3, 4, 2.5);
    }

    ctx.strokeStyle = '#5d4037';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(0, 4, 2.5, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
    ctx.restore();
}

// Logic Game & Mạng P2P
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let myName = 'Hành Giả';
let myX = 800;
let myY = 660;
let isMeditating = false;
let walkPhase = 0;
let chatMessage = '';
let chatTimer = 0;

let keys = {};
let peer = null;
let connections = {};
let remotePlayers = {};
const GLOBAL_ROOM_ID = 'thien_vien_online_room_v2026';

window.addEventListener('keydown', e => {
    if (document.activeElement.tagName === 'INPUT') return;
    keys[e.key.toLowerCase()] = true;
    if (e.code === 'Space') {
        e.preventDefault();
        toggleMeditate();
    } else if (e.key === 'Enter') {
        document.getElementById('chat-input').focus();
    }
});
window.addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
});

function joinGame() {
    const val = document.getElementById('username-input').value.trim();
    if (val) myName = val;

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('ui-bottom').style.display = 'flex';
    initMultiplayer();
}

function initMultiplayer() {
    peer = new Peer(GLOBAL_ROOM_ID);

    peer.on('open', id => {
        updateOnlineUI();
        startSyncLoop();
    });

    peer.on('error', err => {
        if (err.type === 'unavailable-id') {
            peer = new Peer();
            peer.on('open', myId => {
                connectToPeer(GLOBAL_ROOM_ID);
                startSyncLoop();
            });
            peer.on('connection', handleIncomingConnection);
        } else {
            updateOnlineUI();
            startSyncLoop();
        }
    });

    peer.on('connection', handleIncomingConnection);
}

function connectToPeer(targetId) {
    if (connections[targetId] || targetId === peer.id) return;
    try {
        const conn = peer.connect(targetId, { reliable: false });
        setupConnEvents(conn);
    } catch(e) {}
}

function handleIncomingConnection(conn) {
    setupConnEvents(conn);
}

function setupConnEvents(conn) {
    connections[conn.peer] = conn;

    conn.on('open', () => {
        updateOnlineUI();
        if (peer.id === GLOBAL_ROOM_ID) {
            const peerList = Object.keys(connections);
            conn.send({ type: 'PEER_LIST', list: peerList });
        }
    });

    conn.on('data', data => {
        if (data.type === 'PEER_LIST') {
            data.list.forEach(pId => connectToPeer(pId));
        } else if (data.type === 'STATE') {
            remotePlayers[data.id] = { ...data, lastSeen: Date.now() };
            if (peer.id === GLOBAL_ROOM_ID) {
                for (let id in connections) {
                    if (id !== data.id && connections[id].open) {
                        connections[id].send(data);
                    }
                }
            }
            updateOnlineUI();
        }
    });

    conn.on('close', () => {
        delete connections[conn.peer];
        delete remotePlayers[conn.peer];
        updateOnlineUI();
    });
}

function startSyncLoop() {
    setInterval(() => {
        if (!peer || !peer.id) return;
        const payload = {
            type: 'STATE',
            id: peer.id,
            name: myName,
            x: Math.round(myX),
            y: Math.round(myY),
            cfg: avatarConfig,
            meditating: isMeditating,
            walkPhase: walkPhase,
            chat: chatMessage
        };
        for (let id in connections) {
            if (connections[id].open) {
                connections[id].send(payload);
            }
        }
        const now = Date.now();
        for (let rId in remotePlayers) {
            if (now - remotePlayers[rId].lastSeen > 5000) {
                delete remotePlayers[rId];
                updateOnlineUI();
            }
        }
    }, 100);
}

function updateOnlineUI() {
    const count = 1 + Object.keys(remotePlayers).length;
    document.getElementById('online-count').innerText = `● Đang online chung: ${count} hành giả`;
}

function toggleMeditate() {
    isMeditating = !isMeditating;
    const btn = document.getElementById('meditate-btn');
    if (isMeditating) {
        btn.innerText = '🚶 Đứng Dậy';
        btn.classList.add('meditating');
    } else {
        btn.innerText = '🧘 Ngồi Thiền';
        btn.classList.remove('meditating');
    }
}

function handleChatKey(e) {
    if (e.key === 'Enter') {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (text) {
            chatMessage = text;
            chatTimer = 360;
        }
        input.value = '';
        input.blur();
    }
}

function canMoveTo(nx, ny) {
    if (nx < 30 || nx > MAP_WIDTH - 30 || ny < 40 || ny > MAP_HEIGHT - 30) return false;
    if (ny > RIVER_Y - 10 && ny < RIVER_Y + RIVER_H + 10) {
        if (nx < BRIDGE.x + 8 || nx > BRIDGE.x + BRIDGE.w - 8) return false;
    }
    const distPond = Math.hypot(nx - POND.x, ny - POND.y);
    if (distPond < POND.r + 12) return false;
    // Va chạm bệ tượng Phật khổng lồ
    if (nx > TEMPLE.x + TEMPLE.w/2 - 105 && nx < TEMPLE.x + TEMPLE.w/2 + 105 && ny > TEMPLE.y + 30 && ny < TEMPLE.y + 195) return false;
    return true;
}

function update() {
    if (!isMeditating) {
        let dx = 0, dy = 0;
        const speed = 3.2;
        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;

        if (dx !== 0 || dy !== 0) {
            const len = Math.hypot(dx, dy);
            dx = (dx / len) * speed;
            dy = (dy / len) * speed;

            if (canMoveTo(myX + dx, myY)) myX += dx;
            if (canMoveTo(myX, myY + dy)) myY += dy;
            walkPhase += 0.25;
        } else {
            walkPhase = 0;
        }
    }

    if (chatTimer > 0) {
        chatTimer--;
        if (chatTimer === 0) chatMessage = '';
    }
}

function draw(time) {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const camX = Math.floor(canvas.width / 2 - myX);
    const camY = Math.floor(canvas.height / 2 - myY);

    ctx.save();
    ctx.translate(camX, camY);

    drawMap(ctx, time);

    let allEntities = [
        { x: myX, y: myY, name: myName, cfg: avatarConfig, meditating: isMeditating, walkPhase: walkPhase, chat: chatMessage }
    ];
    for (let id in remotePlayers) {
        allEntities.push(remotePlayers[id]);
    }
    allEntities.sort((a, b) => a.y - b.y);

    allEntities.forEach(p => {
        drawChibiCharacter(ctx, p.x, p.y, p.name, p.cfg, p.meditating, p.walkPhase, p.chat, time, 1);
    });

    ctx.restore();
}

function gameLoop(time) {
    update();
    draw(time);
    requestAnimationFrame(gameLoop);
}

initCreatorUI();
requestAnimationFrame(gameLoop);
</script>
