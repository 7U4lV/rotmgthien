<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROTMGTHIEN - Thiền Viện Vipassana & Ba La Mật</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            overflow: hidden; background: #090b09;
            font-family: 'Courier New', Courier, monospace; color: #f4f6f2;
            display: flex; justify-content: center; align-items: center;
        }
        #game-frame {
            position: relative;
            width: min(100vw, calc(100dvh * 9 / 16));
            height: min(100dvh, calc(100vw * 16 / 9));
            background: #141a13; overflow: hidden;
            box-shadow: 0 0 36px rgba(0,0,0,0.9);
        }
        #gameCanvas {
            width: 100%; height: 100%; display: block;
            image-rendering: pixelated; image-rendering: crisp-edges;
            touch-action: none;
        }
        #ui-tooltip {
            position: fixed; z-index: 60; pointer-events: none;
            background: rgba(12,16,12,0.95); border: 1px solid #f4d03f;
            color: #ffeb3b; padding: 4px 8px; border-radius: 5px;
            font-size: 11px; display: none; white-space: nowrap;
        }
        #hud-mini {
            position: absolute; top: 8px; left: 8px; z-index: 15;
            background: rgba(10,14,10,0.78); border: 1px solid rgba(255,255,255,0.16);
            border-radius: 6px; padding: 5px 8px; font-size: 10px; line-height: 1.4;
            pointer-events: none; max-width: 195px;
        }
        #icon-bar-top {
            position: absolute; top: 8px; right: 8px; z-index: 20;
            display: flex; gap: 5px;
        }
        .icon-btn {
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(18,24,18,0.88); border: 1px solid rgba(244,208,63,0.65);
            color: #f4d03f; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn.active { background: #2e7d32; border-color: #a5d6a7; color: #fff; }
        .icon-btn.muted { opacity: 0.6; color: #bbb; border-color: rgba(255,255,255,0.2); }

        #dharma-drawer {
            position: absolute; top: 46px; left: 8px; right: 8px; z-index: 26;
            max-height: 58%; display: none; flex-direction: column; gap: 6px;
            background: rgba(10, 14, 10, 0.94); border: 1px solid #f4d03f;
            border-radius: 9px; padding: 9px; font-size: 11px;
            overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
        }
        .drawer-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
        .d-tab {
            flex: 1; min-width: 60px; padding: 5px 4px; border-radius: 5px;
            background: #20291f; border: 1px solid #485844; color: #d6dfd2;
            font-family: inherit; font-size: 10px; cursor: pointer; text-align: center;
        }
        .d-tab.active { background: #d4af37; color: #111; font-weight: bold; }
        .card-box {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px; padding: 7px; line-height: 1.4;
        }
        .card-title { color: #ffe082; font-weight: bold; margin-bottom: 3px; }
        .ref-link { color: #81c784; text-decoration: underline; font-size: 10px; }

        #test-panel {
            position: absolute; top: 46px; right: 8px; z-index: 27;
            width: 204px; display: none; flex-direction: column; gap: 4px;
            background: rgba(12, 16, 12, 0.94); border: 1px solid #f4d03f;
            border-radius: 8px; padding: 7px; font-size: 10px;
        }
        .test-title { color: #f4d03f; font-weight: bold; margin-bottom: 2px; }
        .test-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
        .t-btn {
            background: #232d21; border: 1px solid #4d5e48; color: #e8efe5;
            border-radius: 4px; padding: 4px 2px; font-family: inherit; font-size: 9px; cursor: pointer;
        }
        .t-btn.active { background: #d4af37; color: #111; font-weight: bold; }

        #chat-dock {
            position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 20;
            display: none; flex-direction: column; gap: 5px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.18);
            padding: 6px; border-radius: 9px;
        }
        #chat-header {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 10px; color: #dce6d8;
        }
        #chat-log {
            max-height: 76px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px;
            padding-right: 2px; touch-action: pan-y; -webkit-overflow-scrolling: touch;
        }
        #chat-log.expanded { max-height: 170px; }
        .chat-item {
            font-size: 11px; line-height: 1.3; padding: 2px 5px;
            background: rgba(0, 0, 0, 0.28); border-radius: 4px; word-break: break-word;
            transition: opacity 0.4s;
        }
        .chat-item.fading { opacity: 0.25; }
        .chat-input-row { display: flex; gap: 6px; align-items: center; }
        #chat-input {
            flex: 1; min-width: 0; background: rgba(12, 16, 12, 0.72); border: 1px solid #485644;
            color: #fff; padding: 6px 8px; border-radius: 6px;
            font-family: inherit; font-size: 12px; outline: none; user-select: text;
        }
        #chat-input:focus { border-color: #f4d03f; }

        #login-screen {
            position: absolute; inset: 0; background: rgba(10,14,10,0.96);
            display: flex; justify-content: center; align-items: center; z-index: 30; padding: 10px;
        }
        #login-box {
            width: 100%; background: #1a2118; border: 2px solid #5a6b52;
            border-radius: 10px; padding: 14px;
        }
        .title-txt { margin: 0 0 10px; text-align: center; color: #f4d03f; font-size: 15px; }
        .creator-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .preview-box {
            width: 96px; height: 120px; background: #e6e4dc;
            border: 2px solid #75876b; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        #previewCanvas { image-rendering: pixelated; image-rendering: crisp-edges; }
        .opt-label { font-size: 10px; color: #b8c4b2; margin-bottom: 3px; display: block; }
        .btn-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 7px; }
        .mini-btn {
            background: #283326; border: 1px solid #4e5e48; color: #e0e6dc;
            padding: 4px 7px; border-radius: 4px; font-family: inherit; font-size: 10px; cursor: pointer;
        }
        .mini-btn.active { background: #d4af37; color: #111; font-weight: bold; }
        .swatch { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #3c4639; cursor: pointer; }
        .swatch.active { border-color: #fff; }
        input[type="text"] {
            width: 100%; background: #10140f; border: 1px solid #4e5e48;
            color: #fff; padding: 7px 9px; border-radius: 6px; font-family: inherit; font-size: 12px; outline: none;
        }
        .go-btn {
            width: 100%; background: #467832; border: 2px solid #79b85c; color: #fff;
            padding: 10px; border-radius: 7px; font-family: inherit; font-size: 13px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="ui-tooltip"></div>
    <div id="game-frame">
        <div id="hud-mini">
            <div id="hud-clock" style="color:#f4d03f;font-weight:bold;">00:00</div>
            <div id="hud-zone" style="color:#ffe082;">Mahasi · Chánh Niệm</div>
            <div id="hud-online" style="color:#81c784;">● 1</div>
            <div id="hud-fps" style="color:#90caf9;">60 FPS</div>

        <div id="icon-bar-top">
            <button id="btn-meditate" class="icon-btn" data-tip="Thiền [Space]"
                onpointerenter="showTip(this)" onpointerleave="hideTip()" onclick="toggleMeditate()">🧘</button>
            <button id="btn-dharma" class="icon-btn" data-tip="Vipassana & Quest"
                onpointerenter="showTip(this)" onpointerleave="hideTip()" onclick="toggleDharmaDrawer()">📜</button>
            <button id="btn-music" class="icon-btn muted" data-tip="Nhạc [M]"
                onpointerenter="showTip(this)" onpointerleave="hideTip()" onclick="toggleMusic()">🎵</button>
            <button id="btn-test" class="icon-btn" data-tip="Test nhanh"
                onpointerenter="showTip(this)" onpointerleave="hideTip()" onclick="toggleTestPanel()">Test</button>
        </div>

        <div id="dharma-drawer"
            onpointerdown="event.stopPropagation()"
            ontouchstart="event.stopPropagation()"
            ontouchmove="event.stopPropagation()">
            <div class="drawer-tabs">
                <button class="d-tab active" id="dtab-vipassana" onclick="switchDharmaTab('vipassana')">Vipassana</button>
                <button class="d-tab" id="dtab-parami" onclick="switchDharmaTab('parami')">Ba La Mật</button>
                <button class="d-tab" id="dtab-quest" onclick="switchDharmaTab('quest')">Quest</button>
                <button class="d-tab" id="dtab-myanmar" onclick="switchDharmaTab('myanmar')">Myanmar</button>
            </div>
            <div id="dharma-content"></div>
        </div>

        <div id="test-panel"
            onpointerdown="event.stopPropagation()"
            ontouchstart="event.stopPropagation()"
            ontouchmove="event.stopPropagation()">
            <div class="test-title">MỐC THIỀN (PHÚT)</div>
            <div class="test-grid">
                <button class="t-btn" onclick="setTestMedMinutes(0)">0p</button>
                <button class="t-btn" onclick="setTestMedMinutes(12)">10p+</button>
                <button class="t-btn" onclick="setTestMedMinutes(22)">20p+</button>
                <button class="t-btn" onclick="setTestMedMinutes(32)">30p+</button>
                <button class="t-btn" onclick="setTestMedMinutes(52)">50p+</button>
                <button class="t-btn" onclick="setTestMedMinutes(60)">60p</button>
                <button class="t-btn" onclick="setTestMedMinutes(75)">>60p</button>
                <button class="t-btn" onclick="addTestOffering()">+Cúng</button>
                <button class="t-btn" onclick="resetTestOverride()">Tắt test</button>
            </div>
            <div class="test-title" style="margin-top:4px;">NGÀY/ĐÊM & SƯ</div>
            <div class="test-grid">
                <button class="t-btn" onclick="setTestTimeMode('day')">Ngày</button>

            </div>
        </div>

        <div id="login-screen">
            <div id="login-box">
                <h2 class="title-txt">ROTMGTHIEN · THIỀN VIỆN</h2>
                <div class="creator-row">
                    <div class="preview-box">
                        <canvas id="previewCanvas" width="92" height="116"></canvas>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <span class="opt-label">Giới tính</span>
                        <div class="btn-row" id="gender-row">
                            <button class="mini-btn active" onclick="setGender('male', this)">Nam</button>
                            <button class="mini-btn" onclick="setGender('female', this)">Nữ</button>
                        </div>
                        <span class="opt-label">Da</span>
                        <div class="btn-row" id="skin-row"></div>
                    </div>
                </div>
                <span class="opt-label">Kiểu tóc</span>
                <div class="btn-row" id="hair-row"></div>
                <span class="opt-label">Áo</span>
                <div class="btn-row" id="outfit-row"></div>
                <span class="opt-label">Tên</span>
                <input type="text" id="name-input" maxlength="14" value="Hành Giả">
                <button class="go-btn" onclick="enterGame()">VÀO THIỀN VIỆN</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="chat-dock"
            onpointerdown="event.stopPropagation()"
            ontouchstart="event.stopPropagation()"
            ontouchmove="event.stopPropagation()">
            <div id="chat-header">
                <span>Pháp đàm & Chánh niệm (60s)</span>
                <button id="btn-chat-expand" class="mini-btn" onclick="toggleChatExpand()" title="Mở rộng / Thu gọn">▲</button>
            </div>
            <div id="chat-log"
                onpointerdown="event.stopPropagation()"
                ontouchstart="event.stopPropagation()"
                ontouchmove="event.stopPropagation()"></div>
            <div class="chat-input-row">
                <input type="text" id="chat-input" maxlength="60" placeholder="Chia sẻ quán chiếu / Mettā..." onkeydown="onChatKey(event)">
                <button class="icon-btn" data-tip="Gửi [Enter]"
                    onpointerenter="showTip(this)" onpointerleave="hideTip()" onclick="sendChat()">💬</button>
            </div>
        </div>

<script>
// --- 1. CẤU HÌNH BẢN ĐỒ (~70% DIỆN TÍCH CŨ: 1400 x 1190) & KHU THIỀN VIỆN MYANMAR ---
const SKIN_LIST = ['#f2a679', '#ffdbac', '#e0ac69', '#c68642', '#8d5524'];
const HAIR_LIST = ['Mái Ngang', 'Rẽ Ngôi', 'Búi Đỉnh', 'Tóc Dài', 'Đầu Trọc'];
const OUTFIT_LIST = [
    { name: 'Áo Lam',  shirt: '#5fa8c9', vest: '#6d4c3d', pants: '#2d6a8e', skirt: '#4a6b53' },
    { name: 'Áo Nâu',  shirt: '#a1887f', vest: '#5d4037', pants: '#4e342e', skirt: '#5d4037' },
    { name: 'Áo Vàng', shirt: '#e6b85c', vest: '#8d5524', pants: '#37474f', skirt: '#6d4c41' },
    { name: 'Áo Hồng', shirt: '#d9829b', vest: '#7a3e52', pants: '#374151', skirt: '#5c3d4e' }
];

const ZONES = [
    { id: 0, name: 'Mahasi · Chánh Niệm',      groundDay: '#496b38', groundNight: '#152215', bodhiTint: '#66bb6a', note: 'Ghi nhận phồng/xẹp & bước chân tỉnh giác.' },
    { id: 1, name: 'Mogok · Quán Nhân Quả',     groundDay: '#4f653c', groundNight: '#172018', bodhiTint: '#81c784', note: 'Thấy rõ vô thường - khổ - vô ngã qua cảm thọ.' },
    { id: 2, name: 'Pa-Auk · Định & Minh Sát',  groundDay: '#3d6842', groundNight: '#12241c', bodhiTint: '#4db6ac', note: 'An trú hơi thở (Ānāpānasati) phát sinh định tĩnh.' },
    { id: 3, name: 'Shwe Oo Min · Tĩnh Lặng',   groundDay: '#55693a', groundNight: '#182114', bodhiTint: '#aed581', note: 'Buông xả căng thẳng, trở về sự biết đơn thuần.' }
];

const MAP_W = 1400;
const MAP_H = 1190;
const BODHI = { x: 700, y: 315, r: 96 };
const GATE = { x: 700, y: 635, w: 92, h: 64 };
const POND = { x: 1030, y: 740, r: 116 };
const ROOM_ID = 'thienvien_v10_room';
const MAX_CONNS = 24;
const MAX_RENDER = 100;
const IDLE_FRAME_MS = 1000 / 30;
const CHAT_TTL_MS = 60000;

let currentZoneId = 0;
let cfg = {
    gender: 'male',
    skin: SKIN_LIST[0],
    hairStyle: 1,
    hairColor: '#1d2428',
    hairShade: '#3d4c54',
    outfitId: 0
};

// --- 2. HỆ THỐNG TU TẬP VIPASSANA, 10 BA LA MẬT & QUEST (LƯU LOCALSTORAGE) ---
const PARAMIS = [
    { key: 'dana',       name: 'Bố thí (Dāna)',        desc: 'Cúng dường khất thực hoặc chia sẻ pháp đàm.' },
    { key: 'sila',       name: 'Trì giới (Sīla)',       desc: 'Giữ tâm trong sáng, lời nói hòa ái.' },
    { key: 'nekkhamma',  name: 'Ly tham (Nekkhamma)',   desc: 'Ngồi thiền tĩnh tại, rời xa phiền nhiễu.' },
    { key: 'panna',      name: 'Trí tuệ (Paññā)',      desc: 'Đọc giáo lý Vipassana & quán chiếu thực tại.' },
    { key: 'viriya',     name: 'Tinh tấn (Vīriya)',     desc: 'Duy trì thực hành đều đặn mỗi ngày.' },
    { key: 'khanti',     name: 'Nhẫn nhục (Khanti)',    desc: 'Kiên nhẫn qua các mốc ngồi thiền dài.' },
    { key: 'sacca',      name: 'Chân thật (Sacca)',     desc: 'Ghi nhận đúng sự thật của thân và tâm.' },
    { key: 'adhitthana', name: 'Quyết tâm (Adhiṭṭhāna)',desc: 'Hoàn thành các bài tập quest tu học.' },
    { key: 'metta',      name: 'Từ (Mettā)',            desc: 'Gửi lời chúc bình an trong khung chat.' },
    { key: 'upekkha',    name: 'Xả (Upekkhā)',          desc: 'Quân bình trước mọi biến đổi của cảnh.' }
];

const VIPASSANA_LESSONS = [
    {
        title: 'Tứ Niệm Xứ (Satipatthāna)',
        summary: 'Quán thân, quán thọ, quán tâm, quán pháp một cách khách quan, không chạy theo ưa/ghét.',
        sourceLabel: 'Access to Insight · Satipatthana Sutta',
        url: 'https://www.accesstoinsight.org/tipitaka/mn/mn.010.nysa.html'
    },
    {
        title: 'Quán Hơi Thở (Ānāpānasati)',
        summary: 'Biết rõ hơi thở vào dài/ngắn, thở ra dài/ngắn; khi tâm tán loạn thì nhẹ nhàng biết là tâm tán loạn.',
        sourceLabel: 'Access to Insight · Anapanasati Sutta',
        url: 'https://www.accesstoinsight.org/tipitaka/mn/mn.118.than.html'
    },
    {
        title: 'Ba Đặc Tướng (Anicca · Dukkha · Anattā)',
        summary: 'Mọi hiện tượng đều vô thường, chịu chi phối của sinh-diệt và không thể nắm giữ làm của riêng.',
        sourceLabel: 'Access to Insight · Theravada Library',
        url: 'https://www.accesstoinsight.org/lib/authors/bodhi/waytoend.html'
    }
];

let progress = {
    satiXp: 0,
    meritCount: 0,
    chatCount: 0,
    lessonsRead: [],
    zonesVisited: [0],
    paramiPoints: {}
};
PARAMIS.forEach(p => { progress.paramiPoints[p.key] = 0; });

function loadProgress() {
    try {
        const raw = JSON.parse(localStorage.getItem('rotmgthien_v10_prog') || 'null');
        if (raw) {
            progress = Object.assign(progress, raw);
            progress.paramiPoints = Object.assign(
                PARAMIS.reduce((acc, p) => (acc[p.key] = 0, acc), {}),
                raw.paramiPoints || {}
            );
        }
    } catch (_) {}
}
function saveProgress() {
    try { localStorage.setItem('rotmgthien_v10_prog', JSON.stringify(progress)); } catch (_) {}
}
function addParami(key, amount = 1) {
    progress.paramiPoints[key] = (progress.paramiPoints[key] || 0) + amount;
    progress.satiXp += amount * 10;
    saveProgress();
    updateRankHUD();
}
function getRankName() {
    const xp = progress.satiXp;
    if (xp >= 250) return 'Tuệ Giác Sơ Cấp';
    if (xp >= 140) return 'Minh Sát Hành Giả';
    if (xp >= 70)  return 'Định Tĩnh Hành Giả';
    if (xp >= 25)  return 'Quán Thọ Hành Giả';
    return 'Sơ Hành Giả';
}
function updateRankHUD() {
    const el = document.getElementById('hud-rank');
    if (el) el.textContent = `${getRankName()} · XP ${progress.satiXp}`;
}

function getQuests() {
    const mins = Math.floor(getEffectiveMedMinutes());
    return [
        { id: 'q1', title: '1. An trú hơi thở (10p thiền)', done: mins >= 10 || progress.satiXp >= 10, reward: '+15 XP · Khanti & Nekkhamma' },
        { id: 'q2', title: '2. Cúng dường Sư khất thực', done: progress.meritCount >= 1, reward: '+20 XP · Dāna' },
        { id: 'q3', title: '3. Học 1 giáo lý Vipassana', done: progress.lessonsRead.length >= 1, reward: '+15 XP · Paññā' },
        { id: 'q4', title: '4. Thăm 2 thiền viện Myanmar', done: progress.zonesVisited.length >= 2, reward: '+20 XP · Adhiṭṭhāna' },
        { id: 'q5', title: '5. Gửi 2 lời pháp đàm / Mettā', done: progress.chatCount >= 2, reward: '+15 XP · Mettā & Sīla' }
    ];
}

// --- TRẠNG THÁI TEST NHANH ---
let testTimeMode = null;
let testMedMinutesOverride = null;
let testForceAlms = false;

// --- TOOLTIP & NGĂN KÉO PHÁP HỌC ---
const tipEl = document.getElementById('ui-tooltip');
let tipTimer = null;
function showTip(el) {
    const t = el.getAttribute('data-tip');
    if (!t) return;
    tipEl.textContent = t;
    tipEl.style.display = 'block';
    const r = el.getBoundingClientRect();
    tipEl.style.left = Math.min(window.innerWidth - tipEl.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tipEl.offsetWidth / 2)) + 'px';
    tipEl.style.top = Math.max(8, r.bottom + 6) + 'px';
    clearTimeout(tipTimer);
    tipTimer = setTimeout(hideTip, 2000);
}
function hideTip() { tipEl.style.display = 'none'; }

let activeDharmaTab = 'vipassana';
function toggleDharmaDrawer() {
    const dr = document.getElementById('dharma-drawer');
    const open = dr.style.display !== 'flex';
    dr.style.display = open ? 'flex' : 'none';
    document.getElementById('btn-dharma').classList.toggle('active', open);
    if (open) renderDharmaContent();
}
function switchDharmaTab(tab) {
    activeDharmaTab = tab;
    ['vipassana', 'parami', 'quest', 'myanmar'].forEach(t => {
        document.getElementById('dtab-' + t).classList.toggle('active', t === tab);
    });
    renderDharmaContent();
}
function markLessonRead(idx) {
    if (!progress.lessonsRead.includes(idx)) {
        progress.lessonsRead.push(idx);
        addParami('panna', 2);
        playSfx('chime');
    }
    renderDharmaContent();
}

// --- ÂM THANH 8-BIT WEB AUDIO API (0 KB FILE NGOÀI) ---
let audioCtx = null, isMusicOn = false, musicTimer = null;
const NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

function ensureAudio() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}

function playSfx(kind) {
    if (!isMusicOn) return;
    ensureAudio();
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    if (kind === 'pick') {
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.setValueAtTime(659.25, now + 0.06);
    } else if (kind === 'offering') {
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(587.33, now + 0.08);
        osc.frequency.setValueAtTime(880, now + 0.16);
    } else if (kind === 'gate') {
        osc.frequency.setValueAtTime(329.63, now);
        osc.frequency.setValueAtTime(493.88, now + 0.09);
    } else {
        osc.frequency.setValueAtTime(587.33, now);
    }
    gain.gain.setValueAtTime(0.04, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.3);
}

function toggleMusic() {
    const btn = document.getElementById('btn-music');
    isMusicOn = !isMusicOn;
    btn.classList.toggle('active', isMusicOn);
    btn.classList.toggle('muted', !isMusicOn);
    if (isMusicOn) {
        ensureAudio();
        if (!musicTimer) {
            let i = 0;
            musicTimer = setInterval(() => {
                if (!isMusicOn || document.hidden || !audioCtx || audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(NOTES[(i++ * 2) % NOTES.length], now);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.03, now + 0.12);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 2.25);
            }, 2400);
        }
    }
}
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && isMusicOn) ensureAudio();
});

// --- HÀM VẼ HÌNH KHỐI PIXEL ART THUẦN (KHÔNG BLUR / KHÔNG ARC TRƠN) ---
function fillPixelDisc(ctx, cx, cy, r, step = 4) {
    const r2 = r * r;
    const minY = Math.floor(-r / step) * step;
    const maxY = Math.ceil(r / step) * step;
    for (let dy = minY; dy <= maxY; dy += step) {
        const rem = r2 - dy * dy;
        if (rem < 0) continue;
        const hw = Math.floor(Math.sqrt(rem) / step) * step;
        if (hw > 0) ctx.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw * 2, step);
    }
}

function strokePixelRing(ctx, cx, cy, r, thickness = 4, step = 4) {
    const rOut2 = r * r;
    const rIn = Math.max(0, r - thickness);
    const rIn2 = rIn * rIn;
    const minY = Math.floor(-r / step) * step;
    const maxY = Math.ceil(r / step) * step;
    for (let dy = minY; dy <= maxY; dy += step) {
        const dy2 = dy * dy;
        const remOut = rOut2 - dy2;
        if (remOut < 0) continue;
        const hwOut = Math.floor(Math.sqrt(remOut) / step) * step;
        const remIn = rIn2 - dy2;
        const hwIn = remIn > 0 ? Math.floor(Math.sqrt(remIn) / step) * step : 0;
        if (hwOut > hwIn) {
            ctx.fillRect(Math.round(cx - hwOut), Math.round(cy + dy), hwOut - hwIn, step);
            ctx.fillRect(Math.round(cx + hwIn), Math.round(cy + dy), hwOut - hwIn, step);
        }
    }
}

function fillPixelEllipse(ctx, cx, cy, rx, ry, step = 4) {
    const minY = Math.floor(-ry / step) * step;
    const maxY = Math.ceil(ry / step) * step;
    for (let dy = minY; dy <= maxY; dy += step) {
        const norm = 1 - (dy * dy) / (ry * ry);
        if (norm < 0) continue;
        const hw = Math.floor((rx * Math.sqrt(norm)) / step) * step;
        if (hw > 0) ctx.fillRect(Math.round(cx - hw), Math.round(cy + dy), hw * 2, step);
    }
}

function createDetailedPortraitCanvas(c, isMed, stepFrame, hasFruit = false, isMonk = false) {
    const W = 42, H = 56, S = 2;
    const cv = document.createElement('canvas');
    cv.width = W * S;
    cv.height = H * S;
    const x = cv.getContext('2d');
    x.imageSmoothingEnabled = false;

    const out = isMonk
        ? { shirt: '#b87333', vest: '#8c4a19', pants: '#6d3b14', skirt: '#8c4a19' }
        : (OUTFIT_LIST[c.outfitId] || OUTFIT_LIST[0]);
    const skin = isMonk ? '#e8b48a' : c.skin;
    const skinShadow = '#c97a54';
    const hair = isMonk ? skin : c.hairColor;
    const hairHi = isMonk ? '#ffe0c2' : c.hairShade;
    const ink = '#141518';

    function px(gx, gy, col, gw = 1, gh = 1) {
        x.fillStyle = col;
        x.fillRect(Math.round(gx * S), Math.round(gy * S), Math.round(gw * S), Math.round(gh * S));
    }

    const headY = isMed ? 12 : 4;
    const headX = 21;

    px(headX - 8, headY + 3, ink, 16, 15);
    px(headX - 7, headY + 4, skin, 14, 13);
    px(headX - 7, headY + 14, skinShadow, 14, 3);
    px(headX - 8, headY + 8, skinShadow, 1, 5);
    px(headX + 7, headY + 8, skinShadow, 1, 5);

    const st = isMonk ? 4 : (c.hairStyle % 5);
    if (st !== 4) {
        px(headX - 8, headY + 1, ink, 16, 6);
        px(headX - 7, headY + 2, hair, 14, 4);
        if (st === 0) {
            px(headX - 7, headY + 5, hair, 14, 2);
            px(headX - 5, headY + 2, hairHi, 4, 2);
            px(headX + 2, headY + 2, hairHi, 3, 2);
        } else if (st === 1) {
            px(headX - 6, headY + 2, hairHi, 5, 2);
            px(headX + 1, headY + 3, hairHi, 4, 2);
            px(headX - 6, headY + 5, hair, 6, 2);
            px(headX + 1, headY + 5, hair, 6, 1);
        } else if (st === 2) {
            px(headX - 3, headY - 2, ink, 6, 4);
            px(headX - 2, headY - 1, hairHi, 4, 2);
            px(headX - 7, headY + 5, hair, 14, 1);
        } else if (st === 3) {
            px(headX - 9, headY + 4, ink, 3, 24);
            px(headX - 8, headY + 5, hair, 2, 22);
            px(headX + 6, headY + 4, ink, 3, 24);
            px(headX + 7, headY + 5, hair, 2, 22);
        }
    } else {
        px(headX - 5, headY + 4, '#ffffff', 3, 1);
    }

    if (!isMonk && c.gender === 'female' && st !== 4) {
        px(headX - 8, headY + 6, ink, 2, 11);
        px(headX - 8, headY + 7, hair, 1, 9);
        px(headX + 6, headY + 6, ink, 2, 11);
        px(headX + 7, headY + 7, hair, 1, 9);
        if (!isMed) {
            px(headX + 7, headY + 14, ink, 5, 7);
            px(headX + 8, headY + 15, hair, 3, 5);
        }
    }

    px(headX - 6, headY + 8, ink, 4, 1);
    px(headX + 2, headY + 8, ink, 4, 1);

    if (isMed || isMonk) {
        px(headX - 6, headY + 10, ink, 4, 1);
        px(headX + 2, headY + 10, ink, 4, 1);
    } else {
        px(headX - 6, headY + 10, '#ffffff', 4, 2);
        px(headX - 5, headY + 10, ink, 2, 2);
        px(headX + 2, headY + 10, '#ffffff', 4, 2);
        px(headX + 3, headY + 10, ink, 2, 2);
    }

    px(headX, headY + 12, skinShadow, 1, 2);
    px(headX - 2, headY + 15, '#c96a6a', 4, 1);

    const bodyY = headY + 18;
    px(headX - 3, bodyY - 1, skinShadow, 6, 2);

    if (!isMed) {
        const legShift = (stepFrame === 1) ? 2 : (stepFrame === 2 ? -2 : 0);
        px(headX - 8, bodyY + 1, ink, 16, 13);
        px(headX - 7, bodyY + 2, out.shirt, 14, 11);
        px(headX - 8, bodyY + 2, ink, 5, 11);
        px(headX - 7, bodyY + 2, out.vest, 3, 11);
        px(headX + 3, bodyY + 2, ink, 5, 11);
        px(headX + 4, bodyY + 2, out.vest, 3, 11);

        px(headX - 11, bodyY + 2, ink, 3, 11);
        px(headX - 10, bodyY + 3, out.shirt, 2, 7);
        px(headX - 10, bodyY + 10, skin, 2, 3);

        px(headX + 8, bodyY + 2, ink, 3, 11);
        px(headX + 8, bodyY + 3, out.shirt, 2, 7);
        px(headX + 8, bodyY + 10, skin, 2, 3);

        if (!isMonk && c.gender === 'female') {
            px(headX - 8, bodyY + 14, ink, 16, 9);
            px(headX - 7, bodyY + 15, out.skirt, 14, 7);
            px(headX - 3, bodyY + 15, '#2b3d30', 1, 7);
            px(headX + 2, bodyY + 15, '#2b3d30', 1, 7);
            px(headX - 6, bodyY + 23, ink, 4, 8 + legShift);
            px(headX - 5, bodyY + 23, skin, 2, 7 + legShift);
            px(headX + 2, bodyY + 23, ink, 4, 8 - legShift);
            px(headX + 3, bodyY + 23, skin, 2, 7 - legShift);
            px(headX - 7, bodyY + 30 + legShift, ink, 5, 3);
            px(headX - 6, bodyY + 31 + legShift, out.vest, 3, 1);
            px(headX + 2, bodyY + 30 - legShift, ink, 5, 3);
            px(headX + 3, bodyY + 31 - legShift, out.vest, 3, 1);
        } else {
            px(headX - 7, bodyY + 14, ink, 14, 17);
            px(headX - 6, bodyY + 15, out.pants, 5, 15);
            px(headX + 1, bodyY + 15, out.pants, 5, 15);
            px(headX - 7, bodyY + 30 + legShift, ink, 6, 3);
            px(headX - 6, bodyY + 31 + legShift, out.vest, 4, 1);
            px(headX + 1, bodyY + 30 - legShift, ink, 6, 3);
            px(headX + 2, bodyY + 31 - legShift, out.vest, 4, 1);
        }

        if (isMonk) {
            px(headX - 6, bodyY + 9, ink, 12, 6);
            px(headX - 5, bodyY + 10, '#3e2723', 10, 4);
        } else if (hasFruit) {
            px(headX + 8, bodyY + 6, ink, 6, 6);
            px(headX + 9, bodyY + 7, '#ff5252', 4, 4);
            px(headX + 10, bodyY + 5, '#66bb6a', 2, 2);
        }
    } else {
        px(headX - 8, bodyY + 1, ink, 16, 11);
        px(headX - 7, bodyY + 2, out.shirt, 14, 9);
        px(headX - 8, bodyY + 2, ink, 5, 9);
        px(headX - 7, bodyY + 2, out.vest, 3, 9);
        px(headX + 3, bodyY + 2, ink, 5, 9);
        px(headX + 4, bodyY + 2, out.vest, 3, 9);

        px(headX - 13, bodyY + 8, ink, 6, 4);
        px(headX - 12, bodyY + 9, out.shirt, 4, 2);
        px(headX - 14, bodyY + 10, skin, 3, 3);

        px(headX + 7, bodyY + 8, ink, 6, 4);
        px(headX + 8, bodyY + 9, out.shirt, 4, 2);
        px(headX + 11, bodyY + 10, skin, 3, 3);

        px(headX - 12, bodyY + 12, ink, 24, 9);
        px(headX - 11, bodyY + 13, out.pants, 22, 7);
        px(headX - 4, bodyY + 16, ink, 8, 4);
        px(headX - 3, bodyY + 17, out.pants, 6, 2);
    }

    return cv;
}

const charCache = new Map();
function getCharFrames(name, c, hasFruit = false, isMonk = false) {
    const key = `${name}|${c.gender}|${c.skin}|${c.hairStyle}|${c.outfitId}|${hasFruit ? 1 : 0}|${isMonk ? 1 : 0}`;
    if (charCache.has(key)) return charCache.get(key);
    if (charCache.size > 600) charCache.delete(charCache.keys().next().value);

    const poses = [
        { med: false, step: 0 },
        { med: false, step: 1 },
        { med: false, step: 2 },
        { med: true,  step: 0 }
    ];

    const frames = poses.map((p, idx) => {
        const spr = createDetailedPortraitCanvas(c, p.med, p.step, hasFruit, isMonk);
        const cv = document.createElement('canvas');
        cv.width = 144;
        cv.height = 132;
        const cx = cv.getContext('2d');
        cx.imageSmoothingEnabled = false;

        cx.fillStyle = 'rgba(0,0,0,0.38)';
        fillPixelEllipse(cx, 72, 118, p.med ? 26 : 16, 6, 2);

        const bob = (idx === 1 || idx === 2) ? -2 : 0;
        const topY = Math.round(118 - spr.height + bob);
        cx.drawImage(spr, Math.round(72 - spr.width / 2), topY);

        if (name) {
            cx.font = 'bold 10px "Courier New", monospace';
            cx.textAlign = 'center';
            cx.fillStyle = isMonk ? '#ffe082' : '#ffeb3b';
            cx.fillText(name, 72, Math.max(12, topY - 5));
        }
        return cv;
    });

    charCache.set(key, frames);
    return frames;
}

function buildMap(night) {

// --- 4. OBJECT POOL HẠT HIỆU ỨNG (BƯỚM 60S, CÁNH HOA, ĐOM ĐÓM) ---
const pool = [];
for (let i = 0; i < 120; i++) {
    pool.push({ active: false, type: 'butterfly', x: 0, y: 0, vx: 0, vy: 0, life: 0, maxLife: 1, col: '#ffe082', r: 3 });
}
function spawnParticle(type, x, y, vx, vy, maxLife, col, r = 3) {
    for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        if (!p.active) {
            p.active = true; p.type = type; p.x = x; p.y = y;
            p.vx = vx; p.vy = vy; p.life = 0; p.maxLife = maxLife; p.col = col; p.r = r;
            return p;
        }
    }
    return null;
}

let lastButterflyWave = 0;
function spawnButterfliesAroundGrass() {
    GRASS_CLUMPS.forEach((g, idx) => {
        for (let k = 0; k < 2; k++) {
            const ang = idx + k * 2.1;
            spawnParticle(
                'butterfly',
                g.x + Math.cos(ang) * 16,
                g.y + Math.sin(ang) * 12,
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.4,
                9000,
                (idx + k) % 2 === 0 ? '#ffe082' : '#f48fb1',
                3
            );
        }
    });
}
function spawnCelestialBurst(x, y) {
    for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        spawnParticle('petal', x, y, Math.cos(a) * 1.1, Math.sin(a) * 0.8 + 0.4, 2400, i % 2 === 0 ? '#f48fb1' : '#fff59d', 3);
    }
}
function stepParticles(dt, time) {
    if (time - lastButterflyWave >= 60000) {
        lastButterflyWave = time;
        spawnButterfliesAroundGrass();
    }
    for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        if (!p.active) continue;
        p.life += dt;
        if (p.life >= p.maxLife) { p.active = false; continue; }
        if (p.type === 'butterfly') {
            p.x += Math.cos(time * 0.002 + i) * 0.65 + p.vx;
            p.y += Math.sin(time * 0.0025 + i) * 0.55 + p.vy;
        } else if (p.type === 'petal') {
            p.x += Math.sin(time * 0.004 + i) * 0.5 + p.vx * 0.25;
            p.y += 0.55 + p.vy * 0.2;
        } else {
            p.x += p.vx;
            p.y += p.vy;
        }
    }
}
function drawParticles(ctx, time) {
    for (let i = 0; i < pool.length; i++) {
        const p = pool[i];
        if (!p.active) continue;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - p.life / p.maxLife);
        if (p.type === 'butterfly') {
            const flap = Math.sin(time * 0.018 + i) > 0 ? 3 : 1;
            ctx.fillStyle = p.col;
            ctx.fillRect(Math.round(p.x - flap), Math.round(p.y - 2), flap, 4);
            ctx.fillRect(Math.round(p.x + 1), Math.round(p.y - 2), flap, 4);
        } else {
            ctx.fillStyle = p.col;
            ctx.fillRect(Math.round(p.x), Math.round(p.y), p.r, p.r);
        }
        ctx.restore();
    }
}

// --- 5. HÀO QUANG NGỒI THIỀN PIXEL ART THEO MỐC PHÚT (LẤY ĐẦU LÀM TÂM) ---
function getEffectiveMedMinutes() {
    if (testMedMinutesOverride !== null) return testMedMinutesOverride;
    if (!isMed || !medStartAt) return 0;
    return (Date.now() - medStartAt) / 60000;
}

function drawHeadHalo(ctx, headCx, headCy, mins, time, meritBoost) {
    if (!isMed && mins <= 0 && meritBoost <= 0) return;

    const pulse = 0.94 + Math.sin(time * 0.004) * 0.06;
    const boostR = meritBoost * 3.5;
    const baseR = Math.round((24 + Math.min(34, mins * 0.45) + boostR) * pulse);
    const cx = Math.round(headCx);
    const cy = Math.round(headCy);

    ctx.save();

    if (mins > 60) {
        const colors7 = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#00b0ff', '#3d5afe', '#d500f9'];
        colors7.forEach((col, idx) => {
            ctx.fillStyle = col;
            ctx.globalAlpha = Math.max(0.22, 0.72 - idx * 0.08);
            strokePixelRing(ctx, cx, cy, baseR + idx * 4, 4, 4);
        });
        ctx.globalAlpha = 0.95;
        // Hoa lá mọc quanh chỗ ngồi đung đưa theo gió
        for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2 + time * 0.0005;
            const sway = Math.round(Math.sin(time * 0.003 + i) * 3);
            const fx = Math.round(cx + Math.cos(a) * (baseR + 14) + sway);
            const fy = Math.round(cy + Math.sin(a) * (baseR * 0.65) + 28);
            ctx.fillStyle = '#66bb6a'; ctx.fillRect(fx - 2, fy + 2, 4, 5);
            ctx.fillStyle = '#f48fb1'; ctx.fillRect(fx - 3, fy - 2, 6, 4);
        }
        // Chim nhỏ đậu & mổ hạt quanh chân hành giả + bướm bay vòng quanh
        for (let b = 0; b < 4; b++) {
            if (b < 2) {
                const peck = Math.sin(time * 0.01 + b * 2) > 0.4 ? 2 : 0;
                const birdX = cx + (b === 0 ? -36 : 36);
                const birdY = cy + 36 + peck;
                ctx.fillStyle = '#8d6e63'; ctx.fillRect(birdX - 4, birdY - 3, 8, 5);
                ctx.fillStyle = '#ffca28'; ctx.fillRect(birdX + (b === 0 ? 4 : -6), birdY - 2, 3, 2);
                ctx.fillStyle = '#fff59d'; ctx.fillRect(birdX + (b === 0 ? 8 : -9), birdY + 2, 2, 2);
            } else {
                const ang = time * 0.0018 + b * 2.1;
                const bx = Math.round(cx + Math.cos(ang) * (baseR + 18));
                const by = Math.round(cy + Math.sin(ang) * (baseR * 0.85));
                const flap = Math.sin(time * 0.02 + b) > 0 ? 3 : 1;
                ctx.fillStyle = '#fff59d';
                ctx.fillRect(bx - flap, by - 2, flap, 4);
                ctx.fillRect(bx + 1, by - 2, flap, 4);
            }
        }
    } else if (mins >= 60) {
        const colors5 = ['#ff5252', '#ffab40', '#ffff00', '#69f0ae', '#40c4ff'];
        colors5.forEach((col, idx) => {
            ctx.fillStyle = col;
            ctx.globalAlpha = Math.max(0.14, 0.65 - idx * 0.12);
            strokePixelRing(ctx, cx, cy, baseR + idx * 4, 4, 4);
        });
    } else if (mins >= 50) {
        ctx.fillStyle = '#ffd54f'; ctx.globalAlpha = 0.55;
        fillPixelDisc(ctx, cx, cy, baseR, 4);
        ctx.fillStyle = '#29b6f6'; ctx.globalAlpha = 0.62;
        strokePixelRing(ctx, cx, cy, baseR + 6, 4, 4);
    } else if (mins >= 30) {
        ctx.fillStyle = 'rgba(255, 167, 38, 0.34)';
        fillPixelDisc(ctx, cx, cy, baseR + 8, 4);
        ctx.fillStyle = 'rgba(255, 241, 118, 0.52)';
        fillPixelDisc(ctx, cx, cy, Math.round(baseR * 0.65), 4);
    } else if (mins >= 20) {
        ctx.fillStyle = 'rgba(238, 255, 65, 0.45)';
        fillPixelDisc(ctx, cx, cy, baseR + 4, 4);
    } else if (mins >= 10) {
        ctx.fillStyle = 'rgba(255, 245, 157, 0.42)';
        fillPixelDisc(ctx, cx, cy, baseR, 4);
    } else {
        ctx.fillStyle = 'rgba(255, 245, 157, 0.38)';
        fillPixelDisc(ctx, cx, cy, 20 + Math.round(boostR), 4);
    }

    ctx.restore();
}

// --- 6. SỰ KIỆN SƯ ĐI KHẤT THỰC (06:00 - 11:00 VN) & 3 CHƯ THIÊN ---
let monk = null;
let hasFruitInHand = false;
let almsCooldownUntil = 0;

const FRUIT_SPOTS = [
    { x: BODHI.x - 42, y: BODHI.y - 24, ripe: false },
    { x: BODHI.x + 42, y: BODHI.y - 24, ripe: false },
    { x: 245, y: 840, ripe: false },
    { x: 1155, y: 960, ripe: false }
];

function spawnAlmsMonkIfNeeded(force = false) {
    const clk = getVNClock();
    if (!isAlmsWindow(clk.hours)) {
        monk = null;
        FRUIT_SPOTS.forEach(f => { f.ripe = false; });
        return;
    }
    if (monk) return;
    const now = Date.now();
    if (!force && now < almsCooldownUntil) return;

    const routes = [
        { sx: 30, sy: 620, ex: MAP_W - 30, ey: 620 },
        { sx: MAP_W - 30, sy: 510, ex: 30, ey: 510 },
        { sx: 30, sy: 840, ex: MAP_W - 30, ey: 840 }
    ];
    const rt = routes[Math.floor(Math.random() * routes.length)];
    monk = {
        x: rt.sx, y: rt.sy, ex: rt.ex, ey: rt.ey,
        spd: 1.05, walk: 0,
        cfg: { gender: 'male', skin: '#e8b48a', hairStyle: 4, hairColor: '#e8b48a', hairShade: '#ffe0c2', outfitId: 1 },
        celestials: [0, 2.1, 4.2].map(ph => ({ phase: ph }))
    };
    FRUIT_SPOTS.forEach(f => { f.ripe = true; });
    almsCooldownUntil = now + 45000;
}

function stepAlmsEvent(dt, time) {
    const clk = getVNClock();
    if (!isAlmsWindow(clk.hours)) {
        if (monk) { monk = null; FRUIT_SPOTS.forEach(f => { f.ripe = false; }); }
        return;
    }
    if (!monk) spawnAlmsMonkIfNeeded(false);
    if (!monk) return;

    const dx = monk.ex - monk.x;
    const dy = monk.ey - monk.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 4) {
        monk.x += (dx / dist) * monk.spd;
        monk.y += (dy / dist) * monk.spd;
        monk.walk += 0.18;
    } else {
        monk = null;
        FRUIT_SPOTS.forEach(f => { f.ripe = false; });
        return;
    }

    if (!hasFruitInHand) {
        for (let i = 0; i < FRUIT_SPOTS.length; i++) {
            const fs = FRUIT_SPOTS[i];
            if (fs.ripe && Math.hypot(myX - fs.x, myY - fs.y) < 38) {
                fs.ripe = false;
                hasFruitInHand = true;
                playSfx('pick');
                pushChatLine(myName, 'Đã hái trái dâng Sư');
                break;
            }
        }
    }

    if (hasFruitInHand && Math.hypot(myX - monk.x, myY - monk.y) < 46) {
        hasFruitInHand = false;
        progress.meritCount++;
        addParami('dana', 2);
        spawnCelestialBurst(monk.x, monk.y - 45);
        playSfx('offering');
        pushChatLine(myName, `Cúng dường thành tâm (Phước: ${progress.meritCount})`);
        updateStatusHUD();
    }

    if (progress.meritCount > 0 && Math.random() < 0.08) {
        const c0 = monk.celestials[0];
        const cx = monk.x + Math.cos(time * 0.003 + c0.phase) * 34;
        const cy = monk.y - 54 + Math.sin(time * 0.004 + c0.phase) * 16;
        spawnParticle('petal', cx, cy, (Math.random() - 0.5) * 0.6, 0.5, 1900, '#fff59d', 3);
    }
}

function drawAlmsWorld(ctx, time) {
    FRUIT_SPOTS.forEach(fs => {
        if (!fs.ripe) return;
        ctx.fillStyle = '#141518';
        ctx.fillRect(Math.round(fs.x - 5), Math.round(fs.y - 5), 10, 10);
        ctx.fillStyle = '#ff5252';
        ctx.fillRect(Math.round(fs.x - 4), Math.round(fs.y - 4), 8, 8);
        ctx.fillStyle = '#ffeb3b';
        ctx.fillRect(Math.round(fs.x - 2), Math.round(fs.y - 3), 2, 2);
    });

    if (!monk) return;
    const frames = getCharFrames('Vị Sư', monk.cfg, false, true);
    const fIdx = Math.sin(monk.walk) >= 0 ? 1 : 2;
    ctx.drawImage(frames[fIdx], Math.round(monk.x - 72), Math.round(monk.y - 118));

    if (progress.meritCount > 0) {
        monk.celestials.forEach((cel, idx) => {
            const ang = time * 0.0025 + cel.phase + idx * 0.3;
            const gx = Math.round(monk.x + Math.cos(ang) * 34);
            const gy = Math.round(monk.y - 56 + Math.sin(ang * 1.3) * 18);
            ctx.fillStyle = 'rgba(255, 245, 157, 0.35)';
            fillPixelDisc(ctx, gx, gy, 8, 2);
            ctx.fillStyle = '#fff9c4';
            ctx.fillRect(gx - 2, gy - 2, 4, 4);
        });
    }
}

const chatLogEl = document.getElementById('chat-log');
let chatExpanded = false;
const chatEntries = [];

function toggleChatExpand() {
    chatExpanded = !chatExpanded;
    chatLogEl.classList.toggle('expanded', chatExpanded);
    document.getElementById('btn-chat-expand').textContent = chatExpanded ? '▼' : '▲';
}

function pushChatLine(sender, text) {
    const clean = String(text || '').trim();
    if (!clean) return;
    chatEntries.push({ sender, text: clean, createdAt: Date.now() });
    if (chatEntries.length > 60) chatEntries.shift();
    renderChatLog();
}

function renderChatLog() {
    const now = Date.now();
    while (chatEntries.length > 0 && now - chatEntries[0].createdAt > CHAT_TTL_MS) {
        chatEntries.shift();
    }
    chatLogEl.innerHTML = '';
    chatEntries.forEach(item => {
        const age = now - item.createdAt;
        const div = document.createElement('div');
        div.className = 'chat-item' + (age > CHAT_TTL_MS - 8000 ? ' fading' : '');
        div.textContent = `${item.sender}: ${item.text}`;
        chatLogEl.appendChild(div);
    });
    chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;

function sendChat() {
    const inp = document.getElementById('chat-input');
    const v = inp.value.trim();
    if (v) {
        chatMsg = v;
        chatTicks = 300;
        progress.chatCount++;
        addParami('metta', 1);
        pushChatLine(myName, v);
    }
    inp.value = '';
    inp.blur();
}
function onChatKey(e) { if (e.key === 'Enter') sendChat(); }

function enterGame() {
    myName = (document.getElementById('name-input').value || '').trim() || 'Hành Giả';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-dock').style.display = 'flex';
    addParami('viriya', 1);
    startP2P();
}

let peer = null, syncTimer = null, seq = 0;
const conns = {}, remotes = {}, profiles = {}, seen = new Set();

function makePeer(id) {
    const p = id ? new Peer(id) : new Peer();
    p.on('open', () => {
        if (p.id !== ROOM_ID) connectTo(ROOM_ID);
        startSync();
    });
    p.on('disconnected', () => { try { if (!p.destroyed) p.reconnect(); } catch (_) {} });
    p.on('error', err => {
        if (err && err.type === 'unavailable-id' && id) { try { p.destroy(); } catch (_) {} peer = makePeer(null); }
        else startSync();
    });
    p.on('connection', bindConn);
    return p;
}

function startP2P() {
    if (typeof Peer === 'undefined') return;
    peer = makePeer(ROOM_ID);
}

function connectTo(id) {
    if (!id || !peer || peer.destroyed || conns[id] || id === peer.id || Object.keys(conns).length >= MAX_CONNS) return;
    try { bindConn(peer.connect(id, { reliable: false })); } catch (_) {}
}

function bindConn(conn) {
    conns[conn.peer] = conn;
    conn.on('open', () => {
        if (conn.open) conn.send({ t: 'P', id: peer.id, n: myName, c: cfg });
        const peers = Object.keys(conns).filter(x => x !== conn.peer).slice(0, 12);
        if (peers.length && conn.open) conn.send({ t: 'L', l: peers });
    });
    conn.on('data', d => {
        if (!d || !d.t) return;
        if (d.t === 'L' && Array.isArray(d.l)) d.l.forEach(connectTo);
        else if (d.t === 'P') {
            profiles[d.id] = { n: d.n || 'Hành Giả', c: d.c || cfg };
            if (remotes[d.id]) { remotes[d.id].name = profiles[d.id].n; remotes[d.id].cfg = profiles[d.id].c; }
        } else if (d.t === 'M') {
            if (d.mid) {
                if (seen.has(d.mid)) return;
                seen.add(d.mid);
                if (seen.size > 1500) seen.delete(seen.values().next().value);
            }
            const pr = profiles[d.id] || { n: 'Hành Giả', c: cfg };
            let rp = remotes[d.id];
            if (!rp) {
                rp = remotes[d.id] = {
                    id: d.id, name: pr.n, cfg: pr.c,
                    x: d.x, y: d.y, tx: d.x, ty: d.y,
                    med: !!(d.f & 1), walk: 0, chat: d.ch || '',
                    merit: d.mr || 0, medMins: d.mm || 0, zone: d.z || 0, ts: Date.now()
                };
                if (!profiles[d.id] && conn.open) conn.send({ t: 'QP', target: d.id });
            } else {
                rp.tx = d.x; rp.ty = d.y; rp.med = !!(d.f & 1);
                rp.merit = d.mr || 0; rp.medMins = d.mm || 0; rp.zone = d.z || 0;
                if (d.ch && d.ch !== rp.chat) pushChatLine(rp.name, d.ch);
                rp.chat = d.ch || ''; rp.ts = Date.now();
            }
            if ((d.h || 0) < 3) {
                for (const k in conns) if (k !== conn.peer && conns[k] && conns[k].open) conns[k].send(Object.assign({}, d, { h: (d.h || 0) + 1 }));
            }
            document.getElementById('hud-online').textContent = '● ' + (1 + Object.keys(remotes).length);
        } else if (d.t === 'QP' && conn.open) {
            if (d.target === peer.id) conn.send({ t: 'P', id: peer.id, n: myName, c: cfg });
            else if (profiles[d.target]) conn.send({ t: 'P', id: d.target, n: profiles[d.target].n, c: profiles[d.target].c });
        }
    });
    conn.on('close', () => { delete conns[conn.peer]; });
    conn.on('error', () => { delete conns[conn.peer]; });
}

function startSync() {
    if (syncTimer) return;
    syncTimer = setInterval(() => {
        if (!peer || peer.destroyed || !peer.id) return;
        if (peer.disconnected) { try { peer.reconnect(); } catch (_) {} }
        const flags = (isMed ? 1 : 0) | ((!isMed && walk > 0) ? 2 : 0);
        const pkt = {
            t: 'M', mid: `${peer.id}_${++seq}`, id: peer.id,
            x: Math.round(myX), y: Math.round(myY), f: flags,
            ch: chatMsg, mr: progress.meritCount, mm: Math.floor(getEffectiveMedMinutes()),
            z: currentZoneId, h: 0
        };
        for (const k in conns) if (conns[k] && conns[k].open) conns[k].send(pkt);

        const now = Date.now();
        let remChanged = false;
        for (const id in remotes) if (now - remotes[id].ts > 22000) { delete remotes[id]; remChanged = true; }
        if (remChanged) document.getElementById('hud-online').textContent = '● ' + (1 + Object.keys(remotes).length);
        if (peer.id !== ROOM_ID && (!conns[ROOM_ID] || !conns[ROOM_ID].open)) { delete conns[ROOM_ID]; connectTo(ROOM_ID); }
    }, 240);
}

function canWalkTo(nx, ny) {
    if (nx < 28 || nx > MAP_W - 28 || ny < 185 || ny > MAP_H - 28) return false;
    if (Math.hypot(nx - POND.x, ny - POND.y) < POND.r + 6) return false;
    if (Math.hypot(nx - BODHI.x, ny - BODHI.y) < 26) return false;
    return true;
}

function stepSim() {
    if (!isMed) {
        let vx = 0, vy = 0; const spd = 3.6;
        if (keys['w'] || keys['arrowup']) vy -= 1;
        if (keys['s'] || keys['arrowdown']) vy += 1;
        if (keys['a'] || keys['arrowleft']) vx -= 1;
        if (keys['d'] || keys['arrowright']) vx += 1;
        if (vx || vy) {
            const l = Math.hypot(vx, vy);
            const sx = (vx / l) * spd, sy = (vy / l) * spd;
            if (canWalkTo(myX + sx, myY)) myX += sx;
            if (canWalkTo(myX, myY + sy)) myY += sy;
            tx = myX; ty = myY; walk += 0.25;
        } else {
            const dx = tx - myX, dy = ty - myY, d = Math.hypot(dx, dy);
            if (d > spd) {
                const sx = (dx / d) * spd, sy = (dy / d) * spd;
                if (canWalkTo(myX + sx, myY)) myX += sx;
                if (canWalkTo(myX, myY + sy)) myY += sy;
                walk += 0.25;
            } else {
                walk = 0;
            }
        }
        if (Math.abs(myX - GATE.x) < GATE.w * 0.45 && Math.abs(myY - GATE.y) < GATE.h * 0.45 && gateNoticeTicks <= 0) {
            switchZone(currentZoneId + 1);
            gateNoticeTicks = 120;
        }
    }

    for (const id in remotes) {
        const rp = remotes[id], dx = rp.tx - rp.x, dy = rp.ty - rp.y;
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) { rp.x += dx * 0.25; rp.y += dy * 0.25; rp.walk += 0.22; }
        else { rp.x = rp.tx; rp.y = rp.ty; rp.walk = 0; }
    }

    if (chatTicks > 0 && --chatTicks === 0) chatMsg = '';
    if (gateNoticeTicks > 0) gateNoticeTicks--;
}

function drawPerson(ctx, e, t) {
    const rx = Math.round(e.x), ry = Math.round(e.y);
    const frames = getCharFrames(e.name, e.cfg, !!e.hasFruit, false);
    const idx = e.med ? 3 : (e.walk > 0.01 ? (Math.sin(e.walk) >= 0 ? 1 : 2) : 0);
    const headCy = e.med ? (ry - 78) : (ry - 86);
    drawHeadHalo(ctx, rx, headCy, e.medMins || 0, t, e.merit || 0);
    ctx.drawImage(frames[idx], rx - 72, ry - 118);

    if (e.chat) {
        ctx.font = '11px "Courier New", monospace';
        ctx.textAlign = 'center';
        const w = Math.max(ctx.measureText(e.chat).width + 12, 32), by = ry - 134;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(Math.round(rx - w / 2), by, Math.round(w), 18);
        ctx.fillStyle = '#fff59d';
        ctx.fillText(e.chat, rx, by + 13);
    }
}

let lastIdleFrame = 0, lastLoopTime = performance.now(), fpsCnt = 0, fpsTick = performance.now(), lastChatClean = 0;
const list = [];

function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) return;

    const dt = Math.min(100, now - lastLoopTime);
    lastLoopTime = now;

    const isMoving = !isMed && (walk > 0 || keys['w'] || keys['a'] || keys['s'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright'] || Math.hypot(tx - myX, ty - myY) > 3.5);
    if (!isMoving && (now - lastIdleFrame < IDLE_FRAME_MS)) return;
    lastIdleFrame = now;

    fpsCnt++;
    if (now - fpsTick >= 1000) {
        document.getElementById('hud-fps').textContent = fpsCnt + ' FPS';
        fpsCnt = 0; fpsTick = now;
        updateStatusHUD();
    }
    if (now - lastChatClean >= 5000) {
        lastChatClean = now;
        renderChatLog();
    }

    const clk = getVNClock();
    const night = isNightTime(clk.hours);
    document.getElementById('hud-clock').textContent = clk.label;

    stepSim();
    stepAlmsEvent(dt, now);
    stepParticles(dt, now);
    buildMap(night);

    const camX = Math.floor(canvas.width / 2 - myX);
    const camY = Math.floor(canvas.height / 2 - myY);
    const left = -camX, top = -camY, right = left + canvas.width, bottom = top + canvas.height;

    ctx.save();
    ctx.translate(camX, camY);
    const sx = Math.max(0, left), sy = Math.max(0, top);
    const sw = Math.min(MAP_W, right) - sx, sh = Math.min(MAP_H, bottom) - sy;
    if (sw > 0 && sh > 0) ctx.drawImage(staticCanvas, sx, sy, sw, sh, sx, sy, sw, sh);

    const cloudOffset = Math.round(Math.sin(now * 0.00025) * 42);
    ctx.fillStyle = night ? 'rgba(180, 220, 240, 0.16)' : 'rgba(255, 255, 255, 0.45)';
    ctx.fillRect(Math.max(0, left), 124, Math.min(MAP_W, right) - Math.max(0, left), 10);
    ctx.fillRect(Math.max(0, left), 148, Math.min(MAP_W, right) - Math.max(0, left), 10);
    ctx.fillStyle = night ? 'rgba(220, 240, 255, 0.2)' : 'rgba(255, 255, 255, 0.6)';
    for (let cx = 80; cx < MAP_W; cx += 280) {
        ctx.fillRect(cx + cloudOffset, 108, 48, 8);
    }

    drawPondKoi(ctx, now);
    drawAlmsWorld(ctx, now);

    list.length = 0;
    list.push({
        x: myX, y: myY, name: myName, cfg,
        med: isMed, walk, chat: chatMsg,
        medMins: getEffectiveMedMinutes(),
        merit: progress.meritCount,
        hasFruit: hasFruitInHand
    });
    for (const id in remotes) {
        const rp = remotes[id];
        if ((rp.zone || 0) !== currentZoneId) continue;
        if (rp.x >= left - 72 && rp.x <= right + 72 && rp.y >= top - 120 && rp.y <= bottom + 72) {
            list.push(rp);
            if (list.length >= MAX_RENDER) break;
        }
    }
    list.sort((a, b) => a.y - b.y);
    for (let i = 0; i < list.length; i++) drawPerson(ctx, list[i], now);

    drawParticles(ctx, now);

    if (gateNoticeTicks > 0) {
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(GATE.x - 108, GATE.y - 68, 216, 20);
        ctx.fillStyle = '#ffe082';
        ctx.fillText(`Tam Quan: ${ZONES[currentZoneId].name}`, GATE.x, GATE.y - 54);
    }

    ctx.restore();
}

loadProgress();
initCreator();
updateStatusHUD();
requestAnimationFrame(loop);
</script>
