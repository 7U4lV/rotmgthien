const tipEl = document.getElementById('ui-tooltip');
let tipTimer = null;
function showTip(el) {
    const t = el.getAttribute('data-tip');
    if (!t) return;
    tipEl.textContent = t;
    tipEl.style.display = 'block';
    const r = el.getBoundingClientRect();
    tipEl.style.left = Math.min(window.innerWidth - tipEl.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tipEl.offsetWidth / 2)) + 'px';
    tipEl.style.top = Math.max(8, r.bottom + 6) + 'px';
    clearTimeout(tipTimer);
    tipTimer = setTimeout(hideTip, 2000);
}
function hideTip() { tipEl.style.display = 'none'; }

let audioCtx = null, isMusicOn = false, musicTimer = null;
const NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
function toggleMusic() {
    const btn = document.getElementById('btn-music');
    isMusicOn = !isMusicOn;
    btn.classList.toggle('active', isMusicOn);
    btn.classList.toggle('muted', !isMusicOn);
    if (isMusicOn) {
        if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        if (!musicTimer) {
            let i = 0;
            musicTimer = setInterval(() => {
                if (!isMusicOn || document.hidden || !audioCtx || audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(NOTES[(i++ * 2) % NOTES.length], now);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.03, now + 0.12);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 2.25);
            }, 2400);
        }
    }
}
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && isMusicOn && audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
});

// Dựng nhân vật chi tiết (ảnh mẫu image_a85005.jpg & image_a85020.jpg)
function createDetailedPortraitCanvas(c, isMed, stepFrame, isMonk = false) {
    const W = 42, H = 56, S = 2;
    const cv = document.createElement('canvas');
    cv.width = W * S;
    cv.height = H * S;
    const x = cv.getContext('2d');
    x.imageSmoothingEnabled = false;

    const out = isMonk
        ? { shirt: '#d97724', vest: '#9c4a12', pants: '#8a3e0d', skirt: '#8a3e0d' }
        : (OUTFIT_LIST[c.outfitId] || OUTFIT_LIST[0]);
    const skin = c.skin;
    const skinShadow = '#c97a54';
    const hair = c.hairColor;
    const hairHi = c.hairShade;
    const ink = '#141518';

    function px(gx, gy, col, gw = 1, gh = 1) {
        x.fillStyle = col;
        x.fillRect(Math.round(gx * S), Math.round(gy * S), Math.round(gw * S), Math.round(gh * S));
    }

    const headY = isMed ? 12 : 4;
    const headX = 21;

    px(headX - 8, headY + 3, ink, 16, 15);
    px(headX - 7, headY + 4, skin, 14, 13);
    px(headX - 7, headY + 14, skinShadow, 14, 3);
    px(headX - 8, headY + 8, skinShadow, 1, 5);
    px(headX + 7, headY + 8, skinShadow, 1, 5);

    const st = isMonk ? 4 : (c.hairStyle % 5);
    if (st !== 4) {
        px(headX - 8, headY + 1, ink, 16, 6);
        px(headX - 7, headY + 2, hair, 14, 4);
        if (st === 0) {
            px(headX - 7, headY + 5, hair, 14, 2);
            px(headX - 5, headY + 2, hairHi, 4, 2);
            px(headX + 2, headY + 2, hairHi, 3, 2);
        } else if (st === 1) {
            px(headX - 6, headY + 2, hairHi, 5, 2);
            px(headX + 1, headY + 3, hairHi, 4, 2);
            px(headX - 6, headY + 5, hair, 6, 2);
            px(headX + 1, headY + 5, hair, 6, 1);
        } else if (st === 2) {
            px(headX - 3, headY - 2, ink, 6, 4);
            px(headX - 2, headY - 1, hairHi, 4, 2);
            px(headX - 7, headY + 5, hair, 14, 1);
        } else if (st === 3) {
            px(headX - 9, headY + 4, ink, 3, 24);
            px(headX - 8, headY + 5, hair, 2, 22);
            px(headX + 6, headY + 4, ink, 3, 24);
            px(headX + 7, headY + 5, hair, 2, 22);
        }
    } else {
        px(headX - 5, headY + 4, '#ffffff', 3, 1);
    }

    if (!isMonk && c.gender === 'female' && st !== 4) {
        px(headX - 8, headY + 6, ink, 2, 11);
        px(headX - 8, headY + 7, hair, 1, 9);
        px(headX + 6, headY + 6, ink, 2, 11);
        px(headX + 7, headY + 7, hair, 1, 9);
        if (!isMed) {
            px(headX + 7, headY + 14, ink, 5, 7);
            px(headX + 8, headY + 15, hair, 3, 5);
        }
    }

    px(headX - 6, headY + 8, ink, 4, 1);
    px(headX + 2, headY + 8, ink, 4, 1);

    if (isMed) {
        px(headX - 6, headY + 10, ink, 4, 1);
        px(headX + 2, headY + 10, ink, 4, 1);
    } else {
        px(headX - 6, headY + 10, '#ffffff', 4, 2);
        px(headX - 5, headY + 10, ink, 2, 2);
        px(headX + 2, headY + 10, '#ffffff', 4, 2);
        px(headX + 3, headY + 10, ink, 2, 2);
    }

    px(headX, headY + 12, skinShadow, 1, 2);
    px(headX - 2, headY + 15, '#c96a6a', 4, 1);

    const bodyY = headY + 18;
    px(headX - 3, bodyY - 1, skinShadow, 6, 2);

    if (!isMed) {
        const legShift = (stepFrame === 1) ? 2 : (stepFrame === 2 ? -2 : 0);
        px(headX - 8, bodyY + 1, ink, 16, 13);
        px(headX - 7, bodyY + 2, out.shirt, 14, 11);
        px(headX - 8, bodyY + 2, ink, 5, 11);
        px(headX - 7, bodyY + 2, out.vest, 3, 11);
        px(headX + 3, bodyY + 2, ink, 5, 11);
        px(headX + 4, bodyY + 2, out.vest, 3, 11);

        px(headX - 11, bodyY + 2, ink, 3, 11);
        px(headX - 10, bodyY + 3, out.shirt, 2, 7);
        px(headX - 10, bodyY + 10, skin, 2, 3);

        px(headX + 8, bodyY + 2, ink, 3, 11);
        px(headX + 8, bodyY + 3, out.shirt, 2, 7);
        px(headX + 8, bodyY + 10, skin, 2, 3);

        if (isMonk) {
            // Bình bát khất thực
            px(headX - 4, bodyY + 11, ink, 8, 5);
            px(headX - 3, bodyY + 12, '#37474f', 6, 3);
        }

        if (!isMonk && c.gender === 'female') {
            px(headX - 8, bodyY + 14, ink, 16, 9);
            px(headX - 7, bodyY + 15, out.skirt, 14, 7);
            px(headX - 3, bodyY + 15, '#2b3d30', 1, 7);
            px(headX + 2, bodyY + 15, '#2b3d30', 1, 7);
            px(headX - 6, bodyY + 23, ink, 4, 8 + legShift);
            px(headX - 5, bodyY + 23, skin, 2, 7 + legShift);
            px(headX + 2, bodyY + 23, ink, 4, 8 - legShift);
            px(headX + 3, bodyY + 23, skin, 2, 7 - legShift);
            px(headX - 7, bodyY + 30 + legShift, ink, 5, 3);
            px(headX - 6, bodyY + 31 + legShift, out.vest, 3, 1);
            px(headX + 2, bodyY + 30 - legShift, ink, 5, 3);
            px(headX + 3, bodyY + 31 - legShift, out.vest, 3, 1);
        } else {
            px(headX - 7, bodyY + 14, ink, 14, 17);
            px(headX - 6, bodyY + 15, out.pants, 5, 15);
            px(headX + 1, bodyY + 15, out.pants, 5, 15);
            px(headX - 7, bodyY + 30 + legShift, ink, 6, 3);
            px(headX - 6, bodyY + 31 + legShift, out.vest, 4, 1);
            px(headX + 1, bodyY + 30 - legShift, ink, 6, 3);
            px(headX + 2, bodyY + 31 - legShift, out.vest, 4, 1);
        }
    } else {
        px(headX - 8, bodyY + 1, ink, 16, 11);
        px(headX - 7, bodyY + 2, out.shirt, 14, 9);
        px(headX - 8, bodyY + 2, ink, 5, 9);
        px(headX - 7, bodyY + 2, out.vest, 3, 9);
        px(headX + 3, bodyY + 2, ink, 5, 9);
        px(headX + 4, bodyY + 2, out.vest, 3, 9);

        px(headX - 13, bodyY + 8, ink, 6, 4);
        px(headX - 12, bodyY + 9, out.shirt, 4, 2);
        px(headX - 14, bodyY + 10, skin, 3, 3);

        px(headX + 7, bodyY + 8, ink, 6, 4);
        px(headX + 8, bodyY + 9, out.shirt, 4, 2);
        px(headX + 11, bodyY + 10, skin, 3, 3);

        px(headX - 12, bodyY + 12, ink, 24, 9);
        px(headX - 11, bodyY + 13, out.pants, 22, 7);
        px(headX - 4, bodyY + 16, ink, 8, 4);
        px(headX - 3, bodyY + 17, out.pants, 6, 2);
    }

    return cv;
}

// Sprite nấm to (image_a84fc7.jpg), bụi cỏ (image_a85e8d.png), hoa nhỏ (image_a85b06.png), cây bồ đề (image_a85f05.png)
function makePixelSprite(rows, pal, scale = 3) {
    const h = rows.length, w = rows[0].length;
    const cv = document.createElement('canvas');
    cv.width = w * scale;
    cv.height = h * scale;
    const x = cv.getContext('2d');
    x.imageSmoothingEnabled = false;
    for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
            const ch = rows[r][c];
            if (ch !== '.' && pal[ch]) {
                x.fillStyle = pal[ch];
                x.fillRect(c * scale, r * scale, scale, scale);
            }
        }
    }
    return cv;
}

], { K: '#151c14', G: '#2e7d32', L: '#66bb6a', Y: '#dce775', d: '#1b5e20', T: '#6d4c41' }, 6);

const charCache = new Map();
function getCharFrames(name, c, isMonk = false) {
    const key = `${isMonk ? 'MONK' : 'USR'}|${name}|${c.gender}|${c.skin}|${c.hairStyle}|${c.outfitId}`;
    if (charCache.has(key)) return charCache.get(key);
    if (charCache.size > 600) charCache.delete(charCache.keys().next().value);

    const poses = [
        { med: false, step: 0 },
        { med: false, step: 1 },
        { med: false, step: 2 },
        { med: true,  step: 0 }
    ];

    const frames = poses.map((p, idx) => {
        const spr = createDetailedPortraitCanvas(c, p.med, p.step, isMonk);
        const cv = document.createElement('canvas');
        cv.width = 144;
        cv.height = 132;
        const cx = cv.getContext('2d');
        cx.imageSmoothingEnabled = false;

        cx.fillStyle = 'rgba(0,0,0,0.4)';
        cx.beginPath();
        cx.ellipse(72, 118, p.med ? 26 : 16, 5, 0, 0, Math.PI * 2);
        cx.fill();

        const bob = (idx === 1 || idx === 2) ? -2 : 0;
        const topY = Math.round(118 - spr.height + bob);
        cx.drawImage(spr, Math.round(72 - spr.width / 2), topY);

        if (name) {
            cx.font = 'bold 10px "Courier New", monospace';
            cx.textAlign = 'center';
            cx.fillStyle = isMonk ? '#ffe082' : '#ffeb3b';
            cx.fillText(name, 72, Math.max(12, topY - 5));
        }
        return cv;
    });

    charCache.set(key, frames);
    return frames;
}

// Hào quang thiền phát sáng từ đầu làm trung tâm, biến đổi theo phút ngồi thiền + số lần cúng dường
function drawMeditationAura(ctx, cx, cy, medMinutes, offeringCount, t) {
    const offerBoost = Math.min(offeringCount * 4, 24);
    const pulse = 0.95 + Math.sin(t * 0.004) * 0.05;

    let baseR = 24;
    let rings = [];

    if (medMinutes >= 60) {
        baseR = 54 + offerBoost;
        rings = [
            { r: baseR,        col: 'rgba(148, 0, 211, 0.35)', w: 6 },
            { r: baseR * 0.85, col: 'rgba(75, 0, 130, 0.45)',  w: 6 },
            { r: baseR * 0.72, col: 'rgba(0, 128, 255, 0.55)', w: 6 },
            { r: baseR * 0.58, col: 'rgba(0, 230, 118, 0.65)', w: 6 },
            { r: baseR * 0.44, col: 'rgba(255, 235, 59, 0.8)', w: 6 },
            { r: baseR * 0.30, col: 'rgba(255, 145, 0, 0.9)',  w: 6 },
            { r: baseR * 0.16, col: 'rgba(255, 255, 224, 1)',  w: 7 }
        ];
    } else if (medMinutes >= 50) {
        baseR = 46 + offerBoost;
        rings = [
            { r: baseR,        col: 'rgba(41, 182, 246, 0.75)', w: 5 },
            { r: baseR * 0.76, col: 'rgba(255, 167, 38, 0.75)', w: 5 },
            { r: baseR * 0.52, col: 'rgba(255, 238, 88, 0.88)', w: 5 },
            { r: baseR * 0.25, col: 'rgba(255, 255, 220, 1)',    w: 5 }
        ];
    } else if (medMinutes >= 30) {
        baseR = 39 + offerBoost;
        rings = [
            { r: baseR,        col: 'rgba(255, 138, 0, 0.65)',  w: 5 },
            { r: baseR * 0.68, col: 'rgba(212, 225, 87, 0.82)', w: 5 },
            { r: baseR * 0.34, col: 'rgba(255, 253, 180, 0.98)',w: 5 }
        ];
    } else if (medMinutes >= 20) {
        baseR = 33 + offerBoost;
        rings = [
            { r: baseR,        col: 'rgba(205, 220, 57, 0.65)', w: 4 },
            { r: baseR * 0.58, col: 'rgba(255, 245, 157, 0.9)', w: 4 }
        ];
    } else if (medMinutes >= 10) {
        baseR = 28 + offerBoost;
        rings = [
            { r: baseR,        col: 'rgba(255, 213, 79, 0.6)',  w: 3.5 },
            { r: baseR * 0.52, col: 'rgba(255, 252, 200, 0.85)',w: 3 }
        ];
    } else {
        baseR = 24 + offerBoost;
        rings = [
            { r: baseR,        col: 'rgba(255, 241, 118, 0.45)',w: 2.5 }
        ];
    }

    for (let i = 0; i < rings.length; i++) {
        const rg = rings[i];
        ctx.strokeStyle = rg.col;
        ctx.lineWidth = rg.w;
        ctx.beginPath();
        ctx.arc(cx, cy, rg.r * pulse, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Tâm sáng nhất ngay trên đầu
    ctx.fillStyle = 'rgba(255, 255, 240, 0.85)';
    ctx.beginPath();
    ctx.arc(cx, cy, 8 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Trên 60 phút: hoa lá mọc đung đưa + chim & bướm bay chơi đùa xung quanh
    if (medMinutes >= 60) {
        const sway = Math.sin(t * 0.005) * 4;
        for (let i = 0; i < 8; i++) {
            const ang = (i / 8) * Math.PI * 2;
            const hx = cx + Math.cos(ang) * (baseR + 14);
            const hy = cy + Math.sin(ang) * (baseR + 14);
            ctx.fillStyle = '#66bb6a';
            ctx.fillRect(Math.round(hx - 2 + sway * 0.5), Math.round(hy), 4, 6);
            ctx.fillStyle = (i % 2 === 0) ? '#ff80ab' : '#ffeb3b';
            ctx.fillRect(Math.round(hx - 3 + sway), Math.round(hy - 4), 6, 4);
        }
        // Bướm & chim nhỏ bay lượn quanh
        for (let b = 0; b < 4; b++) {
            const ba = t * 0.0018 + b * 1.57;
            const bx = cx + Math.cos(ba) * (baseR + 24);
            const by = cy + Math.sin(ba * 1.3) * (baseR + 18);
            const wing = Math.sin(t * 0.02 + b) > 0 ? 4 : 1;
            ctx.fillStyle = b < 2 ? '#fff59d' : '#80deea';
            ctx.fillRect(Math.round(bx - wing), Math.round(by - 2), wing * 2, 4);
        }
    }
}

function drawPerson(ctx, e, t) {
    const rx = Math.round(e.x), ry = Math.round(e.y);
    const frames = getCharFrames(e.name, e.cfg, !!e.isMonk);
    const idx = e.med ? 3 : (e.walk > 0.01 ? (Math.sin(e.walk) >= 0 ? 1 : 2) : 0);

    const medMins = e.med ? ((e.medElapsedMs || 0) / 60000) : 0;
    const offers = e.offerings || 0;
    if (e.med || offers > 0) {
        drawMeditationAura(ctx, rx, ry - 92, e.med ? medMins : (offers >= 5 ? 60 : 15), offers, t);
    }

    ctx.drawImage(frames[idx], rx - 72, ry - 118);

    // Đang cầm trái cây trên tay
    if (e.holdingFruit) {
        ctx.fillStyle = '#ff5252';
        ctx.beginPath();
        ctx.arc(rx + 20, ry - 52, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#66bb6a';
        ctx.fillRect(rx + 19, ry - 60, 3, 3);
    }

    if (e.chat) {
        ctx.font = '11px "Courier New", monospace';
        ctx.textAlign = 'center';
        const w = Math.max(ctx.measureText(e.chat).width + 12, 32), by = ry - 136;
        ctx.fillStyle = '#fff';
        ctx.fillRect(Math.round(rx - w / 2), by, Math.round(w), 18);
        ctx.fillStyle = '#111';
        ctx.fillText(e.chat, rx, by + 13);
    }
}

// Cây nấm to cao hơn người, khóm bụi cỏ, hoa nhỏ ngẫu nhiên, đá cuội ven hồ
const MUSHROOMS = [
    { x: 240, y: 1220 }, { x: 960, y: 780 }, { x: 260, y: 1840 }, { x: 980, y: 1980 }
];
const BUSHES = [
    { x: 180, y: 980 }, { x: 520, y: 880 }, { x: 860, y: 1020 },
    { x: 220, y: 1460 }, { x: 540, y: 1740 }, { x: 1060, y: 1240 }
];
const RANDOM_FLOWERS = [];
for (let i = 0; i < 85; i++) {
    const fx = 60 + ((i * 293 + (i % 7) * 53) % (MAP_W - 120));
    const fy = 330 + ((i * 431 + (i % 11) * 71) % (MAP_H - 380));
    RANDOM_FLOWERS.push({ x: fx, y: fy, kind: i % SPR_FLOWERS.length });
}
const POND_PEBBLES = [
    { x: POND.x - 118, y: POND.y + 18, rx: 14, ry: 9 },
    { x: POND.x - 75,  y: POND.y + 92, rx: 18, ry: 11 },
    { x: POND.x + 12,  y: POND.y + 128,rx: 15, ry: 9 },
    { x: POND.x + 88,  y: POND.y + 84, rx: 17, ry: 10 },
    { x: POND.x + 124, y: POND.y + 12, rx: 13, ry: 8 }
];

const staticCanvas = document.createElement('canvas');
staticCanvas.width = MAP_W;
staticCanvas.height = MAP_H;
const staticCtx = staticCanvas.getContext('2d', { alpha: false });
let cachedNight = null;

function buildMap(night) {
    if (cachedNight === night) return;
    cachedNight = night;
    const s = staticCtx;

    // Nền cỏ chi tiết phong cách pixel (image_a85eaa.png)
    const tile = 32;
    for (let y = 300; y < MAP_H; y += tile) {
        for (let x = 0; x < MAP_W; x += tile) {
            const alt = ((x / tile) + (y / tile)) % 2 === 0;
            s.fillStyle = night
                ? (alt ? '#172617' : '#132013')
                : (alt ? '#6ea644' : '#63993b');
            s.fillRect(x, y, tile, tile);
            s.fillStyle = night ? '#233822' : '#85bd55';
            s.fillRect(x + 6, y + 8, 3, 2);
            s.fillRect(x + 20, y + 22, 3, 2);
        }
    }

    // Mép trên: núi non kèm mây mờ sương ảo + mặt trời / trăng sao (image_a8c8a6.png)
    const skyGrad = s.createLinearGradient(0, 0, 0, 320);
    if (night) {
        skyGrad.addColorStop(0, '#070d1c');
        skyGrad.addColorStop(1, '#1a2c47');
    } else {
        skyGrad.addColorStop(0, '#4fa3e3');
        skyGrad.addColorStop(1, '#c9ecff');
    }
    s.fillStyle = skyGrad;
    s.fillRect(0, 0, MAP_W, 320);

    if (night) {
        s.fillStyle = '#fff9c4';
        s.beginPath(); s.arc(1030, 72, 22, 0, Math.PI * 2); s.fill();
        s.fillStyle = '#ffffff';
        for (let i = 0; i < 24; i++) {
            s.fillRect((i * 79) % MAP_W, 18 + ((i * 37) % 110), 2, 2);
        }
    } else {
        s.fillStyle = '#ffee58';
        s.beginPath(); s.arc(1030, 76, 28, 0, Math.PI * 2); s.fill();
    }

    // Dãy núi xa & gần
    s.fillStyle = night ? '#1b314a' : '#5e8aa8';
    s.beginPath();
    s.moveTo(0, 310); s.lineTo(180, 130); s.lineTo(420, 230); s.lineTo(680, 110);
    s.lineTo(960, 225); s.lineTo(1180, 145); s.lineTo(MAP_W, 240); s.lineTo(MAP_W, 310);
    s.closePath(); s.fill();

    s.fillStyle = night ? '#14263b' : '#3f6c58';
    s.beginPath();
    s.moveTo(0, 320); s.lineTo(250, 195); s.lineTo(540, 285); s.lineTo(840, 185);
    s.lineTo(1110, 275); s.lineTo(MAP_W, 205); s.lineTo(MAP_W, 320);
    s.closePath(); s.fill();

    // Mây sương mờ cuốn quanh núi
    s.fillStyle = night ? 'rgba(180, 210, 240, 0.16)' : 'rgba(255, 255, 255, 0.52)';
    for (let i = 0; i < 9; i++) {
        const mx = 90 + i * 140;
        const my = 175 + (i % 3) * 34;
        s.beginPath();
        s.ellipse(mx, my, 92, 22, 0, 0, Math.PI * 2);
        s.fill();
    }

    // Hoa nhỏ rải rác khắp map không theo quy luật
    RANDOM_FLOWERS.forEach(f => {
        if (Math.hypot(f.x - POND.x, f.y - POND.y) < POND.r + 24) return;
        s.drawImage(SPR_FLOWERS[f.kind], f.x, f.y);
    });

    // Bể cá + đá cuội to ven hồ
    s.fillStyle = night ? '#37474f' : '#8d8476';
    s.beginPath(); s.ellipse(POND.x, POND.y, POND.r + 10, POND.r * 0.72 + 10, 0, 0, Math.PI * 2); s.fill();
    s.fillStyle = night ? '#123a54' : '#3b82c4';
    s.beginPath(); s.ellipse(POND.x, POND.y, POND.r, POND.r * 0.72, 0, 0, Math.PI * 2); s.fill();

    POND_PEBBLES.forEach(pb => {
        s.fillStyle = '#263238';
        s.beginPath(); s.ellipse(pb.x + 2, pb.y + 3, pb.rx, pb.ry, 0, 0, Math.PI * 2); s.fill();
        s.fillStyle = night ? '#546e7a' : '#90a4ae';
        s.beginPath(); s.ellipse(pb.x, pb.y, pb.rx, pb.ry, 0, 0, Math.PI * 2); s.fill();
    });

    // Khóm bụi cỏ
    BUSHES.forEach(b => {
        s.drawImage(SPR_BUSH, Math.round(b.x - SPR_BUSH.width / 2), Math.round(b.y - SPR_BUSH.height + 6));
    });

    // Cây nấm to cao hơn người
    MUSHROOMS.forEach(m => {
        s.drawImage(SPR_MUSHROOM, Math.round(m.x - SPR_MUSHROOM.width / 2), Math.round(m.y - SPR_MUSHROOM.height + 6));
    });

    // 1 cây bồ đề to
    s.drawImage(SPR_BODHI, Math.round(BODHI.x - SPR_BODHI.width / 2), Math.round(BODHI.y - SPR_BODHI.height + 12));

    // Cổng tam quan ở giữa map (hiện tại empty)
    s.fillStyle = '#6d4c41';
    s.fillRect(GATE.x - 56, GATE.y - 76, 12, 76);
    s.fillRect(GATE.x + 44, GATE.y - 76, 12, 76);
    s.fillRect(GATE.x - 24, GATE.y - 54, 8, 54);
    s.fillRect(GATE.x + 16, GATE.y - 54, 8, 54);
    s.fillStyle = '#c62828';
    s.fillRect(GATE.x - 68, GATE.y - 84, 136, 12);
    s.fillRect(GATE.x - 34, GATE.y - 62, 68, 9);
}

// Hiệu ứng động trên map: ánh sáng cây bồ đề, cổng tam quan phát sáng, cá koi, bướm bụi cỏ, sư khất thực & chư thiên
let fruitSpawned = false;
const FRUITS = [
    { x: BODHI.x - 42, y: BODHI.y - 58, taken: false },
    { x: BODHI.x + 38, y: BODHI.y - 64, taken: false },
    { x: BODHI.x - 12, y: BODHI.y - 84, taken: false },
    { x: BODHI.x + 24, y: BODHI.y - 34, taken: false }
];

let monk = null;
let monkSpawnedOnce = false;
let celestialList = [];
let myHoldingFruit = false;
let myOfferings = 0;

function updateMonkSchedule(vnHour) {
    const inAlmsWindow = (vnHour >= 6 && vnHour < 11);
    if (inAlmsWindow && !monk && !monkSpawnedOnce) {
        monkSpawnedOnce = true;
        const fromLeft = Math.random() < 0.5;
        const startX = fromLeft ? 40 : MAP_W - 40;
        const endX = fromLeft ? MAP_W - 40 : 40;
        const yPos = 980 + Math.floor(Math.random() * 420);
        monk = {
            name: 'Vị Sư Khất Thực',
            cfg: { gender: 'male', skin: SKIN_LIST[1], hairStyle: 4, hairColor: '#1d2428', hairShade: '#3d4c54', outfitId: 0 },
            isMonk: true,
            x: startX, y: yPos, endX, walk: 0, med: false, chat: 'A Di Đà Phật'
        };
        fruitSpawned = true;
        FRUITS.forEach(f => { f.taken = false; });
        celestialList = [0, 1, 2].map(i => ({
            ang: i * 2.09,
            petalProgress: 0,
            tossed: false
        }));
    } else if (!inAlmsWindow && monk) {
        monk = null;
        fruitSpawned = false;
        celestialList = [];
    }
}

function drawDynamicWorld(ctx, now) {
    // 1. Cây bồ đề phát sáng nhẹ tỏa xung quanh
    const bPulse = 0.85 + Math.sin(now * 0.0025) * 0.15;
    const bGrad = ctx.createRadialGradient(BODHI.x, BODHI.y - 48, 12, BODHI.x, BODHI.y - 48, 130 * bPulse);
    bGrad.addColorStop(0, 'rgba(255, 245, 157, 0.36)');
    bGrad.addColorStop(1, 'rgba(255, 245, 157, 0)');
    ctx.fillStyle = bGrad;
    ctx.beginPath(); ctx.arc(BODHI.x, BODHI.y - 48, 130 * bPulse, 0, Math.PI * 2); ctx.fill();

    // 2. Cổng tam quan phát sáng ở giữa map (empty - chưa chuyển map)
    const gPulse = 0.8 + Math.sin(now * 0.003) * 0.2;
    ctx.strokeStyle = `rgba(255, 224, 130, ${0.75 * gPulse})`;
    ctx.lineWidth = 3;
    ctx.strokeRect(GATE.x - 16, GATE.y - 48, 32, 48);

    // 3. Cá Koi trong bể
    for (let i = 0; i < 5; i++) {
        const ang = now * 0.0005 + i * 1.25;
        const kx = POND.x + Math.cos(ang) * 55;
        const ky = POND.y + Math.sin(ang) * 35;
        ctx.fillStyle = i % 2 === 0 ? '#ff6d00' : '#ffffff';
        ctx.fillRect(Math.round(kx - 4), Math.round(ky - 2), 8, 4);
    }

    // 4. Bướm bay xung quanh bụi cỏ sau mỗi 1 phút (mỗi chu kỳ 60s có 15s bướm bay quanh)
    const secInMin = (now / 1000) % 60;
    if (secInMin < 15) {
        BUSHES.forEach((b, idx) => {
            const ba = now * 0.004 + idx;
            const bx = b.x + Math.cos(ba) * 24;
            const by = b.y - 16 + Math.sin(ba * 1.7) * 12;
            ctx.fillStyle = idx % 2 === 0 ? '#fff176' : '#81d4fa';
            ctx.fillRect(Math.round(bx - 3), Math.round(by - 2), 6, 4);
        });
    }

    // 5. Trái cây mọc trên cây khi sư xuất hiện
    if (fruitSpawned) {
        FRUITS.forEach(fr => {
            if (!fr.taken) {
                ctx.fillStyle = '#ff5252';
                ctx.beginPath(); ctx.arc(fr.x, fr.y, 6, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#66bb6a';
                ctx.fillRect(fr.x - 1, fr.y - 8, 3, 3);
            }
        });
    }
}

function updateAndDrawMonkAndCelestials(ctx, now) {
    if (!monk) return;
    const dir = monk.endX > monk.x ? 1 : -1;
    monk.x += dir * 0.65;
    monk.walk += 0.14;

    drawPerson(ctx, monk, now);

    // 3 chư thiên bé như đom đóm bay quanh sư, tung hoa (tung xong hoa mất)
    for (let i = 0; i < celestialList.length; i++) {
        const c = celestialList[i];
        const ca = now * 0.002 + c.ang;
        const cx = monk.x + Math.cos(ca) * 38;
        const cy = monk.y - 78 + Math.sin(ca * 1.4) * 18;

        ctx.fillStyle = '#fff59d';
        ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();

        if (!c.tossed) {
            c.petalProgress += 0.015;
            const py = cy + c.petalProgress * 28;
            const alpha = Math.max(0, 1 - c.petalProgress);
            ctx.fillStyle = `rgba(255, 128, 171, ${alpha})`;
            ctx.fillRect(Math.round(cx - 3), Math.round(py), 5, 4);
            if (c.petalProgress >= 1) c.tossed = true;
        }
    }

    // Đi hết mép map thì sư và chư thiên biến mất
    if ((dir > 0 && monk.x >= monk.endX) || (dir < 0 && monk.x <= monk.endX)) {
        monk = null;
        fruitSpawned = false;
        celestialList = [];
    }
}

function updateStatusHud() {
    const el = document.getElementById('hud-status');
    if (el) el.textContent = `Trái: ${myHoldingFruit ? 1 : 0} | Cúng: ${myOfferings}`;
}

function interactAction() {
    if (!myHoldingFruit && fruitSpawned) {
        for (const fr of FRUITS) {
            if (!fr.taken && Math.hypot(myX - fr.x, myY - fr.y) < 75) {
                fr.taken = true;
                myHoldingFruit = true;
                pushChatLine('Hệ thống', 'Bạn đã hái trái cây, hãy mang tới cúng dường vị sư.');
                updateStatusHud();
                return;
            }
        }
    }
    if (myHoldingFruit && monk && Math.hypot(myX - monk.x, myY - monk.y) < 75) {
        myHoldingFruit = false;
        myOfferings += 1;
        // Reset chư thiên tung hoa mỗi lần cúng dường
        celestialList = [0, 1, 2].map(i => ({ ang: i * 2.09, petalProgress: 0, tossed: false }));
        pushChatLine('Hệ thống', `Bạn đã cúng dường (tổng ${myOfferings} lần)!`);
        updateStatusHud();
    }
}

// Khung chat đen mờ trong suốt 40%, lưu ~60s, có nút co giãn mũi tên & vuốt cuộn
const chatLogEl = document.getElementById('chat-log');
const chatEntries = [];

function renderChatLog() {
    const now = Date.now();
    while (chatEntries.length && now - chatEntries[0].ts > 60000) {
        chatEntries.shift();
    }
    chatLogEl.innerHTML = chatEntries.map(item =>
        `<div class="chat-line"><span class="chat-name">${escapeHtml(item.who)}:</span> ${escapeHtml(item.text)}</div>`
    ).join('');
    chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

function pushChatLine(who, text) {
    chatEntries.push({ who, text, ts: Date.now() });
    renderChatLog();
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({ '&': '&', '<': '<', '>': '>', '"': '"', "'": ''' }[m]));
}

function toggleChatCollapse() {
    const panel = document.getElementById('chat-panel');
    const btn = document.getElementById('chat-toggle');
    const col = panel.classList.toggle('collapsed');
    btn.textContent = col ? '▴' : '▾';
}

setInterval(renderChatLog, 5000);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
function resizeCanvas() {
    const r = document.getElementById('game-frame').getBoundingClientRect();
    canvas.width = Math.max(360, Math.round(r.width));
    canvas.height = Math.max(640, Math.round(r.height));
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let myName = 'Hành Giả', myX = 630, myY = 1260, tx = 630, ty = 1260;
let isMed = false, medStartMs = 0, medElapsedMs = 0, walk = 0, chatMsg = '', chatTicks = 0;
const keys = {};

window.addEventListener('keydown', e => {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    const k = e.key.toLowerCase(); keys[k] = true;
    if (e.code === 'Space') { e.preventDefault(); toggleMeditate(); }
    else if (k === 'm') toggleMusic();
    else if (k === 'e') interactAction();
    else if (e.key === 'Enter') document.getElementById('chat-input').focus();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('pointerdown', e => {
    if (isMed) return;
    const r = canvas.getBoundingClientRect();
    tx = (e.clientX - r.left) - (canvas.width / 2 - myX);
    ty = (e.clientY - r.top) - (canvas.height / 2 - myY);
});

function toggleMeditate() {
    isMed = !isMed;
    document.getElementById('btn-meditate').classList.toggle('active', isMed);
    if (isMed) {
        tx = myX; ty = myY;
        medStartMs = performance.now();
    } else {
        medElapsedMs = 0;
    }
}

function sendChat() {
    const inp = document.getElementById('chat-input');
    const v = inp.value.trim();
    if (v) {
        chatMsg = v;
        chatTicks = 300;
        pushChatLine(myName, v);
    }
    inp.value = ''; inp.blur();
}
function onChatKey(e) { if (e.key === 'Enter') sendChat(); }

let peer = null, syncTimer = null, seq = 0;
const conns = {}, remotes = {}, profiles = {}, seen = new Set();

function enterGame() {
    myName = (document.getElementById('name-input').value || '').trim() || 'Hành Giả';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-panel').style.display = 'flex';
    startP2P();
}

function makePeer(id) {
    const p = id ? new Peer(id) : new Peer();
    p.on('open', () => {
        if (p.id !== ROOM_ID) connectTo(ROOM_ID);
        startSync();
    });
    p.on('disconnected', () => { try { if (!p.destroyed) p.reconnect(); } catch (_) {} });
    p.on('error', err => {
        if (err && err.type === 'unavailable-id' && id) { try { p.destroy(); } catch (_) {} peer = makePeer(null); }
        else startSync();
    });
    p.on('connection', bindConn);
    return p;
}

function startP2P() {
    if (typeof Peer === 'undefined') return;
    peer = makePeer(ROOM_ID);
}

function connectTo(id) {
    if (!id || !peer || peer.destroyed || conns[id] || id === peer.id || Object.keys(conns).length >= MAX_CONNS) return;
    try { bindConn(peer.connect(id, { reliable: false })); } catch (_) {}
}

function bindConn(conn) {
    conns[conn.peer] = conn;
    conn.on('open', () => {
        if (conn.open) conn.send({ t: 'P', id: peer.id, n: myName, c: cfg });
        const peers = Object.keys(conns).filter(x => x !== conn.peer).slice(0, 10);
        if (peers.length && conn.open) conn.send({ t: 'L', l: peers });
    });
    conn.on('data', d => {
        if (!d || !d.t) return;
        if (d.t === 'L' && Array.isArray(d.l)) d.l.forEach(connectTo);
        else if (d.t === 'P') {
            profiles[d.id] = { n: d.n || 'Hành Giả', c: d.c || cfg };
            if (remotes[d.id]) { remotes[d.id].name = profiles[d.id].n; remotes[d.id].cfg = profiles[d.id].c; }
        } else if (d.t === 'M') {
            if (d.mid) {
                if (seen.has(d.mid)) return;
                seen.add(d.mid);
                if (seen.size > 1200) seen.delete(seen.values().next().value);
            }
            const pr = profiles[d.id] || { n: 'Hành Giả', c: cfg };
            let rp = remotes[d.id];
            if (!rp) {
                rp = remotes[d.id] = { id: d.id, name: pr.n, cfg: pr.c, x: d.x, y: d.y, tx: d.x, ty: d.y, med: !!(d.f & 1), walk: 0, chat: d.ch || '', ts: Date.now() };
                if (!profiles[d.id] && conn.open) conn.send({ t: 'QP', target: d.id });
            } else {
                rp.tx = d.x; rp.ty = d.y; rp.med = !!(d.f & 1); rp.chat = d.ch || ''; rp.ts = Date.now();
            }
            if (d.ch) pushChatLine(rp.name, d.ch);
            if ((d.h || 0) < 3) {
                for (const k in conns) if (k !== conn.peer && conns[k] && conns[k].open) conns[k].send(Object.assign({}, d, { h: (d.h || 0) + 1 }));
            }
            document.getElementById('hud-online').textContent = '● ' + (1 + Object.keys(remotes).length);
        } else if (d.t === 'QP' && conn.open) {
            if (d.target === peer.id) conn.send({ t: 'P', id: peer.id, n: myName, c: cfg });
            else if (profiles[d.target]) conn.send({ t: 'P', id: d.target, n: profiles[d.target].n, c: profiles[d.target].c });
        }
    });
    conn.on('close', () => { delete conns[conn.peer]; });
    conn.on('error', () => { delete conns[conn.peer]; });
}

function startSync() {
    if (syncTimer) return;
    syncTimer = setInterval(() => {
        if (!peer || peer.destroyed || !peer.id) return;
        if (peer.disconnected) { try { peer.reconnect(); } catch (_) {} }
        const flags = (isMed ? 1 : 0) | ((!isMed && walk > 0) ? 2 : 0);
        const pkt = { t: 'M', mid: `${peer.id}_${++seq}`, id: peer.id, x: Math.round(myX), y: Math.round(myY), f: flags, ch: chatMsg, h: 0 };
        for (const k in conns) if (conns[k] && conns[k].open) conns[k].send(pkt);

        const now = Date.now();
        let remChanged = false;
        for (const id in remotes) if (now - remotes[id].ts > 22000) { delete remotes[id]; remChanged = true; }
        if (remChanged) document.getElementById('hud-online').textContent = '● ' + (1 + Object.keys(remotes).length);
        if (peer.id !== ROOM_ID && (!conns[ROOM_ID] || !conns[ROOM_ID].open)) { delete conns[ROOM_ID]; connectTo(ROOM_ID); }
    }, 250);
}

function stepSim(now) {
    if (isMed) {
        medElapsedMs = now - medStartMs;
    } else {
        let vx = 0, vy = 0; const spd = 3.5;
        if (keys['w'] || keys['arrowup']) vy -= 1;
        if (keys['s'] || keys['arrowdown']) vy += 1;
        if (keys['a'] || keys['arrowleft']) vx -= 1;
        if (keys['d'] || keys['arrowright']) vx += 1;
        if (vx || vy) {
            const l = Math.hypot(vx, vy);
            myX = Math.max(30, Math.min(MAP_W - 30, myX + (vx / l) * spd));
            myY = Math.max(325, Math.min(MAP_H - 30, myY + (vy / l) * spd));
            tx = myX; ty = myY; walk += 0.25;
        } else {
            const dx = tx - myX, dy = ty - myY, d = Math.hypot(dx, dy);
            if (d > spd) { myX += (dx / d) * spd; myY += (dy / d) * spd; walk += 0.25; }
            else walk = 0;
        }
    }
    for (const id in remotes) {
        const rp = remotes[id], dx = rp.tx - rp.x, dy = rp.ty - rp.y;
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) { rp.x += dx * 0.25; rp.y += dy * 0.25; rp.walk += 0.22; }
        else { rp.x = rp.tx; rp.y = rp.ty; rp.walk = 0; }
    }
    if (chatTicks > 0 && --chatTicks === 0) chatMsg = '';
}

let lastIdleFrame = 0, fpsCnt = 0, fpsTick = performance.now();
const list = [];

function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) return;

    const isMoving = !isMed && (walk > 0 || keys['w'] || keys['a'] || keys['s'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright'] || Math.hypot(tx - myX, ty - myY) > 3.5);
    if (!isMoving && (now - lastIdleFrame < IDLE_FRAME_MS)) return;
    lastIdleFrame = now;

    fpsCnt++;
    if (now - fpsTick >= 1000) {
        document.getElementById('hud-fps').textContent = fpsCnt + ' FPS';
        fpsCnt = 0; fpsTick = now;
    }

    const d = new Date(Date.now() + 7 * 3600000);
    const h = d.getUTCHours(), m = d.getUTCMinutes();
    document.getElementById('hud-clock').textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    const night = (h >= 18 || h < 6);

    updateMonkSchedule(h);
    stepSim(now);
    buildMap(night);

    const camX = Math.floor(canvas.width / 2 - myX);
    const camY = Math.floor(canvas.height / 2 - myY);
    const left = -camX, top = -camY, right = left + canvas.width, bottom = top + canvas.height;

    ctx.save();
    ctx.translate(camX, camY);
    const sx = Math.max(0, left), sy = Math.max(0, top);
    const sw = Math.min(MAP_W, right) - sx, sh = Math.min(MAP_H, bottom) - sy;
    if (sw > 0 && sh > 0) ctx.drawImage(staticCanvas, sx, sy, sw, sh, sx, sy, sw, sh);

    drawDynamicWorld(ctx, now);
    updateAndDrawMonkAndCelestials(ctx, now);

    list.length = 0;
    list.push({
        x: myX, y: myY, name: myName, cfg,
        med: isMed, medElapsedMs, holdingFruit: myHoldingFruit, offerings: myOfferings,
        walk, chat: chatMsg
    });
    for (const id in remotes) {
        const rp = remotes[id];
        if (rp.x >= left - 72 && rp.x <= right + 72 && rp.y >= top - 120 && rp.y <= bottom + 72) {
            list.push(rp);
            if (list.length >= MAX_RENDER) break;
        }
    }
    list.sort((a, b) => a.y - b.y);
    for (let i = 0; i < list.length; i++) drawPerson(ctx, list[i], now);
    ctx.restore();
}

initCreator();
updateStatusHud();
requestAnimationFrame(loop);
</script>
