<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thiền Viện Tối Giản - V7.4</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            overflow: hidden; background: #090b09;
            font-family: 'Courier New', Courier, monospace; color: #f4f6f2;
            display: flex; justify-content: center; align-items: center;
        }
        #game-frame {
            position: relative;
            width: min(100vw, calc(100dvh * 9 / 16));
            height: min(100dvh, calc(100vw * 16 / 9));
            background: #141a13; overflow: hidden;
            box-shadow: 0 0 36px rgba(0,0,0,0.9);
        }
        #gameCanvas {
            width: 100%; height: 100%; display: block;
            image-rendering: pixelated; image-rendering: crisp-edges;
            touch-action: none;
        }
        #ui-tooltip {
            position: fixed; z-index: 60; pointer-events: none;
            background: rgba(12,16,12,0.95); border: 1px solid #f4d03f;
            color: #ffeb3b; padding: 4px 8px; border-radius: 5px;
            font-size: 11px; display: none; white-space: nowrap;
        }
        #hud-mini {
            position: absolute; top: 8px; left: 8px; z-index: 15;
            background: rgba(10,14,10,0.78); border: 1px solid rgba(255,255,255,0.16);
            border-radius: 6px; padding: 5px 8px; font-size: 10px; line-height: 1.4;
            pointer-events: none;
        }
        #icon-bar-top {
            position: absolute; top: 8px; right: 8px; z-index: 20;
            display: flex; gap: 6px;
        }
        .icon-btn {
            width: 34px; height: 34px; border-radius: 8px;
            background: rgba(18,24,18,0.88); border: 1px solid rgba(244,208,63,0.65);
            color: #f4d03f; font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .icon-btn.active { background: #2e7d32; border-color: #a5d6a7; color: #fff; }
        .icon-btn.muted { opacity: 0.6; color: #bbb; border-color: rgba(255,255,255,0.2); }
        #chat-dock {
            position: absolute; bottom: 8px; left: 8px; right: 8px; z-index: 20;
            display: none; gap: 6px; align-items: center;
            background: rgba(12,16,12,0.86); border: 1px solid rgba(255,255,255,0.2);
            padding: 5px; border-radius: 8px;
        }
        #chat-input {
            flex: 1; min-width: 0; background: #0c100c; border: 1px solid #485644;
            color: #fff; padding: 6px 8px; border-radius: 6px;
            font-family: inherit; font-size: 12px; outline: none;
        }
        #login-screen {
            position: absolute; inset: 0; background: rgba(10,14,10,0.96);
            display: flex; justify-content: center; align-items: center; z-index: 30; padding: 10px;
        }
        #login-box {
            width: 100%; background: #1a2118; border: 2px solid #5a6b52;
            border-radius: 10px; padding: 14px;
        }
        .title-txt { margin: 0 0 10px; text-align: center; color: #f4d03f; font-size: 15px; }
        .creator-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
        .preview-box {
            width: 96px; height: 120px; background: #e6e4dc;
            border: 2px solid #75876b; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        #previewCanvas { image-rendering: pixelated; image-rendering: crisp-edges; }
        .opt-label { font-size: 10px; color: #b8c4b2; margin-bottom: 3px; display: block; }
        .btn-row { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 7px; }
        .mini-btn {
            background: #283326; border: 1px solid #4e5e48; color: #e0e6dc;
            padding: 4px 7px; border-radius: 4px; font-family: inherit; font-size: 10px; cursor: pointer;
        }
        .mini-btn.active { background: #d4af37; color: #111; font-weight: bold; }
        .swatch { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #3c4639; cursor: pointer; }
        .swatch.active { border-color: #fff; }
        input[type="text"] {
            width: 100%; background: #10140f; border: 1px solid #4e5e48;
            color: #fff; padding: 7px 9px; border-radius: 6px; font-family: inherit; font-size: 12px; outline: none;
        }
        .go-btn {
            width: 100%; background: #467832; border: 2px solid #79b85c; color: #fff;
            padding: 10px; border-radius: 7px; font-family: inherit; font-size: 13px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="ui-tooltip"></div>
    <div id="game-frame">
        <div id="hud-mini">
            <div id="hud-clock" style="color:#f4d03f;font-weight:bold;">00:00</div>
            <div id="hud-online" style="color:#81c784;">● 1</div>
            <div id="hud-fps" style="color:#90caf9;">60 FPS</div>
        </div>
        <div id="icon-bar-top">
            <button id="btn-meditate" class="icon-btn" data-tip="Thiền [Space]"
                onpointerenter="showTip(this)" onpointerleave="hideTip()" onclick="toggleMeditate()">🧘</button>
            <button id="btn-music" class="icon-btn muted" data-tip="Nhạc [M]"
                onpointerenter="showTip(this)" onpointerleave="hideTip()" onclick="toggleMusic()">🎵</button>
        </div>

        <div id="login-screen">
            <div id="login-box">
                <h2 class="title-txt">THIỀN VIỆN V7.4</h2>
                <div class="creator-row">
                    <div class="preview-box">
                        <canvas id="previewCanvas" width="92" height="116"></canvas>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <span class="opt-label">Giới tính</span>
                        <div class="btn-row" id="gender-row">
                            <button class="mini-btn active" onclick="setGender('male', this)">Nam</button>
                            <button class="mini-btn" onclick="setGender('female', this)">Nữ</button>
                        </div>
                        <span class="opt-label">Da</span>
                        <div class="btn-row" id="skin-row"></div>
                    </div>
                </div>
                <span class="opt-label">Kiểu tóc</span>
                <div class="btn-row" id="hair-row"></div>
                <span class="opt-label">Áo</span>
                <div class="btn-row" id="outfit-row"></div>
                <span class="opt-label">Tên</span>
                <input type="text" id="name-input" maxlength="14" value="Hành Giả">
                <button class="go-btn" onclick="enterGame()">VÀO NGAY</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="chat-dock">
            <input type="text" id="chat-input" maxlength="50" placeholder="Chat..." onkeydown="onChatKey(event)">
            <button class="icon-btn" data-tip="Gửi [Enter]"
                onpointerenter="showTip(this)" onpointerleave="hideTip()" onclick="sendChat()">💬</button>
        </div>
    </div>

<script>
const SKIN_LIST = ['#f2a679', '#ffdbac', '#e0ac69', '#c68642', '#8d5524'];
const HAIR_LIST = ['Mái Ngang', 'Rẽ Ngôi', 'Búi Đỉnh', 'Tóc Dài', 'Đầu Trọc'];
const OUTFIT_LIST = [
    { name: 'Áo Lam',  shirt: '#5fa8c9', vest: '#6d4c3d', pants: '#2d6a8e', skirt: '#4a6b53' },
    { name: 'Áo Nâu',  shirt: '#a1887f', vest: '#5d4037', pants: '#4e342e', skirt: '#5d4037' },
    { name: 'Áo Vàng', shirt: '#e6b85c', vest: '#8d5524', pants: '#37474f', skirt: '#6d4c41' },
    { name: 'Áo Hồng', shirt: '#d9829b', vest: '#7a3e52', pants: '#374151', skirt: '#5c3d4e' }
];

const MAP_W = 2000;
const MAP_H = 1700;
const TEMPLE = { x: 720, y: 270, w: 560, h: 320 };
const POND = { x: 1420, y: 920, r: 165 };
const BRIDGE_X = 1000;
const RIVER_HALF = 56;
const ROOM_ID = 'thienvien_v74_room';
const MAX_CONNS = 20;
const MAX_RENDER = 100;
const IDLE_FRAME_MS = 1000 / 24;

let cfg = {
    gender: 'male',
    skin: SKIN_LIST[0],
    hairStyle: 1,
    hairColor: '#1d2428',
    hairShade: '#3d4c54',
    outfitId: 0
};

const tipEl = document.getElementById('ui-tooltip');
let tipTimer = null;
function showTip(el) {
    const t = el.getAttribute('data-tip');
    if (!t) return;
    tipEl.textContent = t;
    tipEl.style.display = 'block';
    const r = el.getBoundingClientRect();
    tipEl.style.left = Math.min(window.innerWidth - tipEl.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tipEl.offsetWidth / 2)) + 'px';
    tipEl.style.top = Math.max(8, r.bottom + 6) + 'px';
    clearTimeout(tipTimer);
    tipTimer = setTimeout(hideTip, 2000);
}
function hideTip() { tipEl.style.display = 'none'; }

let audioCtx = null, isMusicOn = false, musicTimer = null;
const NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];
function toggleMusic() {
    const btn = document.getElementById('btn-music');
    isMusicOn = !isMusicOn;
    btn.classList.toggle('active', isMusicOn);
    btn.classList.toggle('muted', !isMusicOn);
    if (isMusicOn) {
        if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        if (!musicTimer) {
            let i = 0;
            musicTimer = setInterval(() => {
                if (!isMusicOn || document.hidden || !audioCtx || audioCtx.state !== 'running') return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(NOTES[(i++ * 2) % NOTES.length], now);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.03, now + 0.12);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.2);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 2.25);
            }, 2400);
        }
    }
}
document.addEventListener('visibilitychange', () => {
    if (!document.hidden && isMusicOn && audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
    }
});

// Dựng nhân vật chi tiết 42x56 lấy cảm hứng từ mẫu nhân vật đứng & ngồi thiền
function createDetailedPortraitCanvas(c, isMed, stepFrame) {
    const W = 42, H = 56, S = 2;
    const cv = document.createElement('canvas');
    cv.width = W * S;
    cv.height = H * S;
    const x = cv.getContext('2d');
    x.imageSmoothingEnabled = false;

    const out = OUTFIT_LIST[c.outfitId] || OUTFIT_LIST[0];
    const skin = c.skin;
    const skinShadow = '#c97a54';
    const hair = c.hairColor;
    const hairHi = c.hairShade;
    const ink = '#141518';

    function px(gx, gy, col, gw = 1, gh = 1) {
        x.fillStyle = col;
        x.fillRect(Math.round(gx * S), Math.round(gy * S), Math.round(gw * S), Math.round(gh * S));
    }

    const headY = isMed ? 12 : 4;
    const headX = 21;

    // Viền đầu + mặt
    px(headX - 8, headY + 3, ink, 16, 15);
    px(headX - 7, headY + 4, skin, 14, 13);
    px(headX - 7, headY + 14, skinShadow, 14, 3);
    px(headX - 8, headY + 8, skinShadow, 1, 5);
    px(headX + 7, headY + 8, skinShadow, 1, 5);

    // Tóc đỉnh đầu theo 5 kiểu
    const st = c.hairStyle % 5;
    if (st !== 4) {
        px(headX - 8, headY + 1, ink, 16, 6);
        px(headX - 7, headY + 2, hair, 14, 4);
        if (st === 0) {
            // Mái ngang
            px(headX - 7, headY + 5, hair, 14, 2);
            px(headX - 5, headY + 2, hairHi, 4, 2);
            px(headX + 2, headY + 2, hairHi, 3, 2);
        } else if (st === 1) {
            // Rẽ ngôi lệch (giống mẫu)
            px(headX - 6, headY + 2, hairHi, 5, 2);
            px(headX + 1, headY + 3, hairHi, 4, 2);
            px(headX - 6, headY + 5, hair, 6, 2);
            px(headX + 1, headY + 5, hair, 6, 1);
        } else if (st === 2) {
            // Búi đỉnh
            px(headX - 3, headY - 2, ink, 6, 4);
            px(headX - 2, headY - 1, hairHi, 4, 2);
            px(headX - 7, headY + 5, hair, 14, 1);
        } else if (st === 3) {
            // Tóc dài hai bên
            px(headX - 9, headY + 4, ink, 3, 24);
            px(headX - 8, headY + 5, hair, 2, 22);
            px(headX + 6, headY + 4, ink, 3, 24);
            px(headX + 7, headY + 5, hair, 2, 22);
        }
    } else {
        // Đầu trọc có ánh sáng nhẹ trên trán
        px(headX - 5, headY + 4, '#ffffff', 3, 1);
    }

    // Tóc mái / lọn tóc cho nữ
    if (c.gender === 'female' && st !== 4) {
        px(headX - 8, headY + 6, ink, 2, 11);
        px(headX - 8, headY + 7, hair, 1, 9);
        px(headX + 6, headY + 6, ink, 2, 11);
        px(headX + 7, headY + 7, hair, 1, 9);
        if (!isMed) {
            // Búi/đuôi tóc lệch bên phải như ảnh nữ
            px(headX + 7, headY + 14, ink, 5, 7);
            px(headX + 8, headY + 15, hair, 3, 5);
        }
    }

    // Lông mày
    px(headX - 6, headY + 8, ink, 4, 1);
    px(headX + 2, headY + 8, ink, 4, 1);

    // Mắt (mở khi đứng/đi, nhắm khi ngồi thiền)
    if (isMed) {
        px(headX - 6, headY + 10, ink, 4, 1);
        px(headX + 2, headY + 10, ink, 4, 1);
    } else {
        px(headX - 6, headY + 10, '#ffffff', 4, 2);
        px(headX - 5, headY + 10, ink, 2, 2);
        px(headX + 2, headY + 10, '#ffffff', 4, 2);
        px(headX + 3, headY + 10, ink, 2, 2);
    }

    // Sống mũi & miệng
    px(headX, headY + 12, skinShadow, 1, 2);
    px(headX - 2, headY + 15, '#c96a6a', 4, 1);

    // Cổ & thân áo
    const bodyY = headY + 18;
    px(headX - 3, bodyY - 1, skinShadow, 6, 2);

    if (!isMed) {
        // Tư thế đứng / bước đi
        const legShift = (stepFrame === 1) ? 2 : (stepFrame === 2 ? -2 : 0);

        // Áo sơ mi + gile
        px(headX - 8, bodyY + 1, ink, 16, 13);
        px(headX - 7, bodyY + 2, out.shirt, 14, 11);
        // Gile hai bên
        px(headX - 8, bodyY + 2, ink, 5, 11);
        px(headX - 7, bodyY + 2, out.vest, 3, 11);
        px(headX + 3, bodyY + 2, ink, 5, 11);
        px(headX + 4, bodyY + 2, out.vest, 3, 11);

        // Tay hai bên
        px(headX - 11, bodyY + 2, ink, 3, 11);
        px(headX - 10, bodyY + 3, out.shirt, 2, 7);
        px(headX - 10, bodyY + 10, skin, 2, 3);

        px(headX + 8, bodyY + 2, ink, 3, 11);
        px(headX + 8, bodyY + 3, out.shirt, 2, 7);
        px(headX + 8, bodyY + 10, skin, 2, 3);

        if (c.gender === 'female') {
            // Váy xếp ly
            px(headX - 8, bodyY + 14, ink, 16, 9);
            px(headX - 7, bodyY + 15, out.skirt, 14, 7);
            px(headX - 3, bodyY + 15, '#2b3d30', 1, 7);
            px(headX + 2, bodyY + 15, '#2b3d30', 1, 7);
            // Chân trái & phải
            px(headX - 6, bodyY + 23, ink, 4, 8 + legShift);
            px(headX - 5, bodyY + 23, skin, 2, 7 + legShift);
            px(headX + 2, bodyY + 23, ink, 4, 8 - legShift);
            px(headX + 3, bodyY + 23, skin, 2, 7 - legShift);
            // Giày
            px(headX - 7, bodyY + 30 + legShift, ink, 5, 3);
            px(headX - 6, bodyY + 31 + legShift, out.vest, 3, 1);
            px(headX + 2, bodyY + 30 - legShift, ink, 5, 3);
            px(headX + 3, bodyY + 31 - legShift, out.vest, 3, 1);
        } else {
            // Quần dài + giày
            px(headX - 7, bodyY + 14, ink, 14, 17);
            px(headX - 6, bodyY + 15, out.pants, 5, 15);
            px(headX + 1, bodyY + 15, out.pants, 5, 15);
            px(headX - 7, bodyY + 30 + legShift, ink, 6, 3);
            px(headX - 6, bodyY + 31 + legShift, out.vest, 4, 1);
            px(headX + 1, bodyY + 30 - legShift, ink, 6, 3);
            px(headX + 2, bodyY + 31 - legShift, out.vest, 4, 1);
        }
    } else {
        // Tư thế ngồi thiền xếp bằng (giống ảnh thiền)
        px(headX - 8, bodyY + 1, ink, 16, 11);
        px(headX - 7, bodyY + 2, out.shirt, 14, 9);
        px(headX - 8, bodyY + 2, ink, 5, 9);
        px(headX - 7, bodyY + 2, out.vest, 3, 9);
        px(headX + 3, bodyY + 2, ink, 5, 9);
        px(headX + 4, bodyY + 2, out.vest, 3, 9);

        // Hai cánh tay đưa ra đặt trên đầu gối
        px(headX - 13, bodyY + 8, ink, 6, 4);
        px(headX - 12, bodyY + 9, out.shirt, 4, 2);
        px(headX - 14, bodyY + 10, skin, 3, 3);

        px(headX + 7, bodyY + 8, ink, 6, 4);
        px(headX + 8, bodyY + 9, out.shirt, 4, 2);
        px(headX + 11, bodyY + 10, skin, 3, 3);

        // Chân xếp bằng
        px(headX - 12, bodyY + 12, ink, 24, 9);
        px(headX - 11, bodyY + 13, out.pants, 22, 7);
        px(headX - 4, bodyY + 16, ink, 8, 4);
        px(headX - 3, bodyY + 17, out.pants, 6, 2);
    }

    return cv;
}

const charCache = new Map();
function getCharFrames(name, c) {
    const key = `${name}|${c.gender}|${c.skin}|${c.hairStyle}|${c.outfitId}`;
    if (charCache.has(key)) return charCache.get(key);
    if (charCache.size > 600) charCache.delete(charCache.keys().next().value);

    const poses = [
        { med: false, step: 0 },
        { med: false, step: 1 },
        { med: false, step: 2 },
        { med: true,  step: 0 }
    ];

    const frames = poses.map((p, idx) => {
        const spr = createDetailedPortraitCanvas(c, p.med, p.step);
        const cv = document.createElement('canvas');
        cv.width = 144;
        cv.height = 132;
        const cx = cv.getContext('2d');
        cx.imageSmoothingEnabled = false;

        cx.fillStyle = 'rgba(0,0,0,0.4)';
        cx.beginPath();
        cx.ellipse(72, 118, p.med ? 26 : 16, 5, 0, 0, Math.PI * 2);
        cx.fill();

        const bob = (idx === 1 || idx === 2) ? -2 : 0;
        const topY = Math.round(118 - spr.height + bob);
        cx.drawImage(spr, Math.round(72 - spr.width / 2), topY);

        if (name) {
            cx.font = 'bold 10px "Courier New", monospace';
            cx.textAlign = 'center';
            cx.fillStyle = '#ffeb3b';
            cx.fillText(name, 72, Math.max(12, topY - 5));
        }
        return cv;
    });

    charCache.set(key, frames);
    return frames;
}

function drawHeadHalo(ctx, cx, cy, t) {
    const pulse = 0.94 + Math.sin(t * 0.004) * 0.06;
    const rOut = 28 * pulse;
    const rIn = 20 * pulse;

    ctx.strokeStyle = '#ffca28';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(cx, cy, rOut, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#fff59d';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(cx, cy, rIn, 0, Math.PI * 2);
    ctx.stroke();

    for (let i = 0; i < 6; i++) {
        const ang = (i / 6) * Math.PI * 2 + t * 0.0012;
        const px = Math.round(cx + Math.cos(ang) * (rOut + 5));
        const py = Math.round(cy + Math.sin(ang) * (rOut + 5));
        ctx.fillStyle = (i % 2 === 0) ? '#fff59d' : '#ffb300';
        ctx.fillRect(px - 2, py - 2, 4, 4);
    }
}

function drawPerson(ctx, e, t) {
    const rx = Math.round(e.x), ry = Math.round(e.y);
    const frames = getCharFrames(e.name, e.cfg);
    const idx = e.med ? 3 : (e.walk > 0.01 ? (Math.sin(e.walk) >= 0 ? 1 : 2) : 0);
    if (e.med) drawHeadHalo(ctx, rx, ry - 86, t);
    ctx.drawImage(frames[idx], rx - 72, ry - 118);
    if (e.chat) {
        ctx.font = '11px "Courier New", monospace';
        ctx.textAlign = 'center';
        const w = Math.max(ctx.measureText(e.chat).width + 12, 32), by = ry - 134;
        ctx.fillStyle = '#fff';
        ctx.fillRect(Math.round(rx - w / 2), by, Math.round(w), 18);
        ctx.fillStyle = '#111';
        ctx.fillText(e.chat, rx, by + 13);
    }
}

function renderPreview() {
    const pc = document.getElementById('previewCanvas');
    if (!pc) return;
    const px = pc.getContext('2d');
    px.imageSmoothingEnabled = false;
    px.clearRect(0, 0, pc.width, pc.height);
    const spr = createDetailedPortraitCanvas(cfg, false, 0);
    px.drawImage(spr, Math.round(46 - spr.width / 2), Math.round(58 - spr.height / 2));
}

function initCreator() {
    const sr = document.getElementById('skin-row');
    SKIN_LIST.forEach((col, i) => {
        const d = document.createElement('div'); d.className = 'swatch' + (i === 0 ? ' active' : ''); d.style.background = col;
        d.onclick = () => { cfg.skin = col; sr.querySelectorAll('.swatch').forEach(x => x.classList.remove('active')); d.classList.add('active'); renderPreview(); };
        sr.appendChild(d);
    });
    const hr = document.getElementById('hair-row');
    HAIR_LIST.forEach((h, i) => {
        const b = document.createElement('button'); b.className = 'mini-btn' + (i === cfg.hairStyle ? ' active' : ''); b.textContent = h;
        b.onclick = () => { cfg.hairStyle = i; hr.querySelectorAll('.mini-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); renderPreview(); };
        hr.appendChild(b);
    });
    const or = document.getElementById('outfit-row');
    OUTFIT_LIST.forEach((o, i) => {
        const b = document.createElement('button'); b.className = 'mini-btn' + (i === 0 ? ' active' : ''); b.textContent = o.name;
        b.onclick = () => { cfg.outfitId = i; or.querySelectorAll('.mini-btn').forEach(x => x.classList.remove('active')); b.classList.add('active'); renderPreview(); };
        or.appendChild(b);
    });
    renderPreview();
}

function setGender(g, btn) {
    cfg.gender = g;
    document.querySelectorAll('#gender-row .mini-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPreview();
}

function getRiverY(x) { return 1240 + Math.sin(x * 0.0038) * 52; }
const LANTERNS = [
    { x: 920, y: 630 }, { x: 1080, y: 630 }, { x: 910, y: 790 }, { x: 1090, y: 790 },
    { x: 900, y: 1030 }, { x: 1100, y: 1030 }, { x: 920, y: 1380 }, { x: 1080, y: 1380 }
];
const TREES = [
    { x: 220, y: 310, col: '#f48fb1' }, { x: 580, y: 330, col: '#f48fb1' }, { x: 1420, y: 290, col: '#f48fb1' },
    { x: 200, y: 590, col: '#fbc02d' }, { x: 660, y: 620, col: '#fbc02d' }, { x: 1780, y: 440, col: '#fbc02d' },
    { x: 160, y: 880, col: '#2e7d32' }, { x: 450, y: 960, col: '#2e7d32' }, { x: 1780, y: 880, col: '#2e7d32' },
    { x: 280, y: 1520, col: '#f48fb1' }, { x: 650, y: 1560, col: '#fbc02d' }, { x: 1420, y: 1520, col: '#2e7d32' }
];
const FLOWERS = [];
for (let i = 0; i < 65; i++) {
    FLOWERS.push({ x: 80 + ((i * 313) % (MAP_W - 160)), y: 250 + ((i * 479) % (MAP_H - 290)) });
}
const KOI_LIST = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#00b0ff', '#651fff'].map((col, idx) => ({
    col, ang: idx * 1.0, rad: 38 + idx * 15, spd: 0.00018 + (idx % 3) * 0.00005
}));

const staticCanvas = document.createElement('canvas');
staticCanvas.width = MAP_W;
staticCanvas.height = MAP_H;
const staticCtx = staticCanvas.getContext('2d', { alpha: false });
let cachedNight = null;

function buildMap(night) {
    if (cachedNight === night) return;
    cachedNight = night;
    const s = staticCtx;

    const tile = 32;
    for (let y = 210; y < MAP_H; y += tile) {
        for (let x = 0; x < MAP_W; x += tile) {
            const v = Math.sin(x * 0.0045) + Math.cos(y * 0.0045);
            const alt = ((x / tile) + (y / tile)) % 2 === 0;
            s.fillStyle = night
                ? (v > 0.3 ? (alt ? '#192517' : '#152013') : (alt ? '#142916' : '#102212'))
                : (v > 0.3 ? (alt ? '#4c6638' : '#435b31') : (alt ? '#2e7d32' : '#266e2a'));
            s.fillRect(x, y, tile, tile);
        }
    }

    s.fillStyle = night ? '#0d1829' : '#95cbf7';
    s.fillRect(0, 0, MAP_W, 220);

    s.fillStyle = night ? '#1b2b3d' : '#6c8e99';
    s.beginPath();
    s.moveTo(0, 220); s.lineTo(0, 125); s.lineTo(300, 58); s.lineTo(680, 132);
    s.lineTo(1020, 48); s.lineTo(1420, 118); s.lineTo(1760, 56); s.lineTo(MAP_W, 125);
    s.lineTo(MAP_W, 220); s.closePath(); s.fill();

    s.strokeStyle = night ? '#4a382e' : '#9e6b4b';
    s.lineWidth = 64;
    s.beginPath();
    s.moveTo(1000, 590);
    for (let y = 590; y <= 1580; y += 24) {
        const wx = (y > 1150 && y < 1330) ? 0 : Math.sin((y - 590) * 0.008) * 26;
        s.lineTo(1000 + wx, y);
    }
    s.stroke();

    s.fillStyle = night ? '#143f59' : '#4682be';
    s.beginPath();
    s.moveTo(0, getRiverY(0) - RIVER_HALF);
    for (let x = 0; x <= MAP_W; x += 28) s.lineTo(x, getRiverY(x) - RIVER_HALF);
    for (let x = MAP_W; x >= 0; x -= 28) s.lineTo(x, getRiverY(x) + RIVER_HALF);
    s.closePath(); s.fill();

    const by = getRiverY(BRIDGE_X);
    s.fillStyle = night ? '#3e2723' : '#6d4c41';
    s.fillRect(BRIDGE_X - 48, by - RIVER_HALF - 8, 96, RIVER_HALF * 2 + 16);

    s.save();
    s.translate(POND.x, POND.y);
    s.fillStyle = night ? '#263228' : '#68785a';
    s.beginPath(); s.arc(0, 0, POND.r + 8, 0, Math.PI, false); s.closePath(); s.fill();
    s.fillStyle = night ? '#123c54' : '#3a7bb8';
    s.beginPath(); s.arc(0, 0, POND.r, 0, Math.PI, false); s.closePath(); s.fill();
    s.restore();

    FLOWERS.forEach(f => {
        if (Math.abs(f.y - getRiverY(f.x)) < RIVER_HALF + 16) return;
        if (f.y >= POND.y - 10 && Math.hypot(f.x - POND.x, f.y - POND.y) < POND.r + 16) return;
        if (f.x > TEMPLE.x - 14 && f.x < TEMPLE.x + TEMPLE.w + 14 && f.y > TEMPLE.y - 14 && f.y < TEMPLE.y + TEMPLE.h + 14) return;
        s.fillStyle = '#ea80fc'; s.fillRect(f.x - 3, f.y - 2, 6, 4);
        s.fillStyle = '#ffea00'; s.fillRect(f.x - 1, f.y - 1, 2, 2);
    });

    s.fillStyle = night ? '#4a3d31' : '#d7bfa0';
    s.fillRect(TEMPLE.x, TEMPLE.y, TEMPLE.w, TEMPLE.h);
    s.strokeStyle = '#111'; s.lineWidth = 3;
    s.strokeRect(TEMPLE.x, TEMPLE.y, TEMPLE.w, TEMPLE.h);

    const cx = TEMPLE.x + TEMPLE.w / 2;
    const cy = TEMPLE.y + 125;
    s.fillStyle = '#f39c12';
    s.fillRect(cx - 42, cy - 8, 84, 18);
    s.fillRect(cx - 26, cy - 42, 52, 34);
    s.fillRect(cx - 16, cy - 72, 32, 30);
    s.fillStyle = '#1c2833';
    s.fillRect(cx - 16, cy - 78, 32, 7);

    LANTERNS.forEach(l => {
        s.fillStyle = night ? '#ffea00' : '#78909c';
        s.fillRect(l.x - 6, l.y - 24, 12, 12);
        s.fillStyle = '#455a64';
        s.fillRect(l.x - 4, l.y - 12, 8, 12);
    });

    TREES.forEach(t => {
        s.fillStyle = 'rgba(0,0,0,0.35)';
        s.beginPath(); s.ellipse(t.x, t.y + 4, 24, 8, 0, 0, Math.PI * 2); s.fill();
        s.fillStyle = '#4e342e';
        s.fillRect(t.x - 5, t.y - 18, 10, 20);
        s.fillStyle = t.col;
        s.beginPath(); s.arc(t.x, t.y - 32, 24, 0, Math.PI * 2); s.fill();
    });
}

function drawPondKoi(ctx, time) {
    ctx.save();
    ctx.translate(POND.x, POND.y);
    KOI_LIST.forEach((f, i) => {
        const t = time * f.spd + f.ang;
        const fx = Math.round(Math.cos(t) * (f.rad * 0.85));
        const fy = Math.round(22 + Math.abs(Math.sin(t * 0.65)) * (f.rad * 0.62));
        ctx.fillStyle = f.col;
        ctx.fillRect(fx - 5, fy - 2, 10, 4);
        const wag = Math.round(Math.sin(time * 0.005 + i) * 2);
        ctx.fillRect(fx - 8, fy - 2 + wag, 3, 4);
    });
    ctx.restore();
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
function resizeCanvas() {
    const r = document.getElementById('game-frame').getBoundingClientRect();
    canvas.width = Math.max(360, Math.round(r.width));
    canvas.height = Math.max(640, Math.round(r.height));
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let myName = 'Hành Giả', myX = 1000, myY = 900, tx = 1000, ty = 900;
let isMed = false, walk = 0, chatMsg = '', chatTicks = 0;
const keys = {};

window.addEventListener('keydown', e => {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    const k = e.key.toLowerCase(); keys[k] = true;
    if (e.code === 'Space') { e.preventDefault(); toggleMeditate(); }
    else if (k === 'm') toggleMusic();
    else if (e.key === 'Enter') document.getElementById('chat-input').focus();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('pointerdown', e => {
    if (isMed) return;
    const r = canvas.getBoundingClientRect();
    tx = (e.clientX - r.left) - (canvas.width / 2 - myX);
    ty = (e.clientY - r.top) - (canvas.height / 2 - myY);
});

function toggleMeditate() {
    isMed = !isMed;
    document.getElementById('btn-meditate').classList.toggle('active', isMed);
    if (isMed) { tx = myX; ty = myY; }
}

function sendChat() {
    const inp = document.getElementById('chat-input');
    const v = inp.value.trim();
    if (v) { chatMsg = v; chatTicks = 300; }
    inp.value = ''; inp.blur();
}
function onChatKey(e) { if (e.key === 'Enter') sendChat(); }

let peer = null, syncTimer = null, seq = 0;
const conns = {}, remotes = {}, profiles = {}, seen = new Set();

function enterGame() {
    myName = (document.getElementById('name-input').value || '').trim() || 'Hành Giả';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-dock').style.display = 'flex';
    startP2P();
}

function makePeer(id) {
    const p = id ? new Peer(id) : new Peer();
    p.on('open', () => {
        if (p.id !== ROOM_ID) connectTo(ROOM_ID);
        startSync();
    });
    p.on('disconnected', () => { try { if (!p.destroyed) p.reconnect(); } catch (_) {} });
    p.on('error', err => {
        if (err && err.type === 'unavailable-id' && id) { try { p.destroy(); } catch (_) {} peer = makePeer(null); }
        else startSync();
    });
    p.on('connection', bindConn);
    return p;
}

function startP2P() {
    if (typeof Peer === 'undefined') return;
    peer = makePeer(ROOM_ID);
}

function connectTo(id) {
    if (!id || !peer || peer.destroyed || conns[id] || id === peer.id || Object.keys(conns).length >= MAX_CONNS) return;
    try { bindConn(peer.connect(id, { reliable: false })); } catch (_) {}
}

function bindConn(conn) {
    conns[conn.peer] = conn;
    conn.on('open', () => {
        if (conn.open) conn.send({ t: 'P', id: peer.id, n: myName, c: cfg });
        const peers = Object.keys(conns).filter(x => x !== conn.peer).slice(0, 10);
        if (peers.length && conn.open) conn.send({ t: 'L', l: peers });
    });
    conn.on('data', d => {
        if (!d || !d.t) return;
        if (d.t === 'L' && Array.isArray(d.l)) d.l.forEach(connectTo);
        else if (d.t === 'P') {
            profiles[d.id] = { n: d.n || 'Hành Giả', c: d.c || cfg };
            if (remotes[d.id]) { remotes[d.id].name = profiles[d.id].n; remotes[d.id].cfg = profiles[d.id].c; }
        } else if (d.t === 'M') {
            if (d.mid) {
                if (seen.has(d.mid)) return;
                seen.add(d.mid);
                if (seen.size > 1200) seen.delete(seen.values().next().value);
            }
            const pr = profiles[d.id] || { n: 'Hành Giả', c: cfg };
            let rp = remotes[d.id];
            if (!rp) {
                rp = remotes[d.id] = { id: d.id, name: pr.n, cfg: pr.c, x: d.x, y: d.y, tx: d.x, ty: d.y, med: !!(d.f & 1), walk: 0, chat: d.ch || '', ts: Date.now() };
                if (!profiles[d.id] && conn.open) conn.send({ t: 'QP', target: d.id });
            } else {
                rp.tx = d.x; rp.ty = d.y; rp.med = !!(d.f & 1); rp.chat = d.ch || ''; rp.ts = Date.now();
            }
            if ((d.h || 0) < 3) {
                for (const k in conns) if (k !== conn.peer && conns[k] && conns[k].open) conns[k].send(Object.assign({}, d, { h: (d.h || 0) + 1 }));
            }
            document.getElementById('hud-online').textContent = '● ' + (1 + Object.keys(remotes).length);
        } else if (d.t === 'QP' && conn.open) {
            if (d.target === peer.id) conn.send({ t: 'P', id: peer.id, n: myName, c: cfg });
            else if (profiles[d.target]) conn.send({ t: 'P', id: d.target, n: profiles[d.target].n, c: profiles[d.target].c });
        }
    });
    conn.on('close', () => { delete conns[conn.peer]; });
    conn.on('error', () => { delete conns[conn.peer]; });
}

function startSync() {
    if (syncTimer) return;
    syncTimer = setInterval(() => {
        if (!peer || peer.destroyed || !peer.id) return;
        if (peer.disconnected) { try { peer.reconnect(); } catch (_) {} }
        const flags = (isMed ? 1 : 0) | ((!isMed && walk > 0) ? 2 : 0);
        const pkt = { t: 'M', mid: `${peer.id}_${++seq}`, id: peer.id, x: Math.round(myX), y: Math.round(myY), f: flags, ch: chatMsg, h: 0 };
        for (const k in conns) if (conns[k] && conns[k].open) conns[k].send(pkt);

        const now = Date.now();
        let remChanged = false;
        for (const id in remotes) if (now - remotes[id].ts > 22000) { delete remotes[id]; remChanged = true; }
        if (remChanged) document.getElementById('hud-online').textContent = '● ' + (1 + Object.keys(remotes).length);
        if (peer.id !== ROOM_ID && (!conns[ROOM_ID] || !conns[ROOM_ID].open)) { delete conns[ROOM_ID]; connectTo(ROOM_ID); }
    }, 250);
}

function stepSim() {
    if (!isMed) {
        let vx = 0, vy = 0; const spd = 3.5;
        if (keys['w'] || keys['arrowup']) vy -= 1;
        if (keys['s'] || keys['arrowdown']) vy += 1;
        if (keys['a'] || keys['arrowleft']) vx -= 1;
        if (keys['d'] || keys['arrowright']) vx += 1;
        if (vx || vy) {
            const l = Math.hypot(vx, vy);
            myX = Math.max(30, Math.min(MAP_W - 30, myX + (vx / l) * spd));
            myY = Math.max(230, Math.min(MAP_H - 30, myY + (vy / l) * spd));
            tx = myX; ty = myY; walk += 0.25;
        } else {
            const dx = tx - myX, dy = ty - myY, d = Math.hypot(dx, dy);
            if (d > spd) { myX += (dx / d) * spd; myY += (dy / d) * spd; walk += 0.25; }
            else walk = 0;
        }
    }
    for (const id in remotes) {
        const rp = remotes[id], dx = rp.tx - rp.x, dy = rp.ty - rp.y;
        if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) { rp.x += dx * 0.25; rp.y += dy * 0.25; rp.walk += 0.22; }
        else { rp.x = rp.tx; rp.y = rp.ty; rp.walk = 0; }
    }
    if (chatTicks > 0 && --chatTicks === 0) chatMsg = '';
}

let lastIdleFrame = 0, fpsCnt = 0, fpsTick = performance.now();
const list = [];

function loop(now) {
    requestAnimationFrame(loop);
    if (document.hidden) return;

    const isMoving = !isMed && (walk > 0 || keys['w'] || keys['a'] || keys['s'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright'] || Math.hypot(tx - myX, ty - myY) > 3.5);
    if (!isMoving && (now - lastIdleFrame < IDLE_FRAME_MS)) return;
    lastIdleFrame = now;

    fpsCnt++;
    if (now - fpsTick >= 1000) {
        document.getElementById('hud-fps').textContent = fpsCnt + ' FPS';
        fpsCnt = 0; fpsTick = now;
    }

    const d = new Date(Date.now() + 7 * 3600000);
    const h = d.getUTCHours(), m = d.getUTCMinutes();
    document.getElementById('hud-clock').textContent = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    const night = (h >= 18 || h < 6);

    stepSim();
    buildMap(night);

    const camX = Math.floor(canvas.width / 2 - myX);
    const camY = Math.floor(canvas.height / 2 - myY);
    const left = -camX, top = -camY, right = left + canvas.width, bottom = top + canvas.height;

    ctx.save();
    ctx.translate(camX, camY);
    const sx = Math.max(0, left), sy = Math.max(0, top);
    const sw = Math.min(MAP_W, right) - sx, sh = Math.min(MAP_H, bottom) - sy;
    if (sw > 0 && sh > 0) ctx.drawImage(staticCanvas, sx, sy, sw, sh, sx, sy, sw, sh);

    drawPondKoi(ctx, now);

    list.length = 0;
    list.push({ x: myX, y: myY, name: myName, cfg, med: isMed, walk, chat: chatMsg });
    for (const id in remotes) {
        const rp = remotes[id];
        if (rp.x >= left - 72 && rp.x <= right + 72 && rp.y >= top - 120 && rp.y <= bottom + 72) {
            list.push(rp);
            if (list.length >= MAX_RENDER) break;
        }
    }
    list.sort((a, b) => a.y - b.y);
    for (let i = 0; i < list.length; i++) drawPerson(ctx, list[i], now);
    ctx.restore();
}

initCreator();
requestAnimationFrame(loop);
</script>
