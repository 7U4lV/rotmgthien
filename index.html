    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            overflow: hidden; background: #090b09;
            font-family: 'Courier New', Courier, monospace; color: #f4f6f2;
            display: flex; justify-content: center; align-items: center;
        }

        /* Khung 9:16 chuẩn dọc điện thoại, tự động co giãn theo tỉ lệ trên màn hình lớn */
        #game-frame {
            position: relative;
            width: min(100vw, calc(100dvh * 9 / 16));
            height: min(100dvh, calc(100vw * 16 / 9));
            background: #141a13;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(244, 208, 63, 0.22);
        }

        #gameCanvas {
            width: 100%; height: 100%; display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
        }

        /* Tooltip mini khi rê chuột / chạm / focus vào icon */
        #ui-tooltip {
            position: fixed; z-index: 60; pointer-events: none;
            background: rgba(12, 16, 12, 0.95); border: 1px solid #f4d03f;
            color: #ffeb3b; padding: 5px 9px; border-radius: 6px;

            display: none; box-shadow: 0 6px 18px rgba(0,0,0,0.75);

            position: absolute; top: 8px; left: 8px; z-index: 15;

            border-radius: 7px; padding: 6px 9px; font-size: 10px; line-height: 1.45;

            width: 34px; height: 34px; border-radius: 8px;

        .icon-btn.muted { opacity: 0.65; border-color: rgba(255,255,255,0.25); color: #bbb; }

        #chat-dock {

            background: rgba(12, 16, 12, 0.86); border: 1px solid rgba(255,255,255,0.2);

            flex: 1; min-width: 0; background: #0c100c; border: 1px solid #485644;

            font-family: inherit; font-size: 12px; outline: none;

            margin: 0 0 10px 0; text-align: center; color: #f4d03f;

        }
        .tab-bar { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn {
            flex: 1; padding: 6px 4px; background: #242e22; border: 1px solid #4e5e48;
            color: #c8d0c4; font-family: inherit; font-size: 11px; font-weight: bold;
            border-radius: 6px; cursor: pointer;

        .tab-btn.active { background: #d4af37; color: #111; border-color: #fff; }

<script>
const tipEl = document.getElementById('ui-tooltip');
let tipAutoHideTimer = null;
function showTip(el) {
    const txt = el.getAttribute('data-tip');
    if (!txt) return;
    tipEl.textContent = txt;
    tipEl.style.display = 'block';
    const r = el.getBoundingClientRect();
    const x = Math.min(window.innerWidth - tipEl.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tipEl.offsetWidth / 2));
    const y = (r.bottom + 6 + tipEl.offsetHeight < window.innerHeight) ? (r.bottom + 6) : (r.top - tipEl.offsetHeight - 6);
    tipEl.style.left = Math.round(x) + 'px';
    tipEl.style.top = Math.round(y) + 'px';
    if (tipAutoHideTimer) clearTimeout(tipAutoHideTimer);
    tipAutoHideTimer = setTimeout(hideTip, 2200);
}
function hideTip() {
    tipEl.style.display = 'none';
}
document.addEventListener('pointerdown', e => {
    if (!e.target.closest || !e.target.closest('.icon-btn')) hideTip();
}, { passive: true });

let audioCtx = null;
let musicInterval = null;
let isMusicOn = false;
const PENTATONIC_NOTES = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

function playSoftBellNote(freq, durationSec = 2.4) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, now);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.035, now + 0.12);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + durationSec + 0.05);
}

function startMusicLoop() {
    if (musicInterval) return;
    let step = 0;
    musicInterval = setInterval(() => {
        if (!isMusicOn) return;
        const note = PENTATONIC_NOTES[(step * 2 + (step % 3)) % PENTATONIC_NOTES.length];
        playSoftBellNote(note, 2.6);
        step = (step + 1) % 64;
    }, 2200);
}

function toggleMusic() {
    const btn = document.getElementById('btn-music');
    if (!isMusicOn) {
        if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        isMusicOn = true;
        startMusicLoop();
        btn.classList.remove('muted');
        btn.classList.add('active');
    } else {
        isMusicOn = false;
        btn.classList.remove('active');
        btn.classList.add('muted');
    }
}

let authMode = 'guest';
const SECRET_POOL = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789@#$%';

function genSecret23() {
    let s = '';
    for (let i = 0; i < 23; i++) {
        s += SECRET_POOL.charAt(Math.floor(Math.random() * SECRET_POOL.length));
    }
    return s;
}

function copySecret() {
    const inp = document.getElementById('reg-secret');
    inp.select();
    if (navigator.clipboard) navigator.clipboard.writeText(inp.value).catch(() => {});
}

function switchTab(mode) {
    authMode = mode;
    document.getElementById('auth-err').textContent = '';
    ['guest', 'register', 'login'].forEach(m => {
        document.getElementById('tab-' + m).classList.toggle('active', m === mode);
    });
    document.getElementById('creator-panel').style.display = (mode === 'login') ? 'none' : 'block';
    document.getElementById('register-panel').style.display = (mode === 'register') ? 'block' : 'none';
    document.getElementById('login-panel').style.display = (mode === 'login') ? 'block' : 'none';
    if (mode === 'register') {
        document.getElementById('reg-secret').value = genSecret23();
    }
}

function loadDB() {
    try { return JSON.parse(localStorage.getItem('thienvien_v62_db') || '{}'); }
    catch (_) { return {}; }
}

function saveDB(db) {
    try { localStorage.setItem('thienvien_v62_db', JSON.stringify(db)); }
    catch (_) {}
}

function submitAuth() {
    const err = document.getElementById('auth-err');
    err.textContent = '';
    const db = loadDB();

    if (authMode === 'guest') {
        myName = (document.getElementById('name-input').value || '').trim() || 'Hành Giả';
        enterGame();
    } else if (authMode === 'register') {
        const id = (document.getElementById('reg-id').value || '').trim();
        const pass = (document.getElementById('reg-pass').value || '').trim();
        const secret = (document.getElementById('reg-secret').value || '').trim();
        const cname = (document.getElementById('name-input').value || '').trim() || 'Hành Giả';
        if (!id || !pass) { err.textContent = 'Nhập ID và mật khẩu.'; return; }
        if (db[id]) { err.textContent = 'ID đã tồn tại.'; return; }
        db[id] = { id, pass, secret, name: cname, cfg: JSON.parse(JSON.stringify(cfg)) };
        saveDB(db);
        myName = cname;
        enterGame();
    } else {
        const id = (document.getElementById('login-id').value || '').trim();
        const cred = (document.getElementById('login-cred').value || '').trim();
        if (!id || !cred) { err.textContent = 'Nhập ID và mật khẩu/mã.'; return; }
        const acc = db[id];
        if (!acc || (acc.pass !== cred && acc.secret !== cred)) {
            err.textContent = 'Thông tin không khớp.'; return;
        }
        myName = acc.name;
        cfg = Object.assign({}, cfg, acc.cfg);
        enterGame();
    }
}

function enterGame() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('chat-dock').style.display = 'flex';
    initP2P();
}

function bakeRotmgSprite(grid, palette, pixelSize = 5, addOutline = true) {
    const h = grid.length;
    const w = grid[0].length;
    const pad = addOutline ? 1 : 0;
    const c = document.createElement('canvas');
    c.width = (w + pad * 2) * pixelSize;
    c.height = (h + pad * 2) * pixelSize;
    const cx = c.getContext('2d');
    cx.imageSmoothingEnabled = false;

    if (addOutline) {
        cx.fillStyle = '#0c0e0c';
        for (let r = 0; r < h; r++) {
            for (let col = 0; col < w; col++) {
                const ch = grid[r][col];
                if (ch !== '.' && palette[ch]) {
                    const gx = col + pad;
                    const gy = r + pad;
                    cx.fillRect((gx - 1) * pixelSize, gy * pixelSize, pixelSize, pixelSize);
                    cx.fillRect((gx + 1) * pixelSize, gy * pixelSize, pixelSize, pixelSize);
                    cx.fillRect(gx * pixelSize, (gy - 1) * pixelSize, pixelSize, pixelSize);
                    cx.fillRect(gx * pixelSize, (gy + 1) * pixelSize, pixelSize, pixelSize);
                }
            }
        }
    }

    for (let r = 0; r < h; r++) {
        for (let col = 0; col < w; col++) {
            const ch = grid[r][col];
            if (ch !== '.' && palette[ch]) {
                cx.fillStyle = palette[ch];
                cx.fillRect((col + pad) * pixelSize, (r + pad) * pixelSize, pixelSize, pixelSize);
            }
        }
    }
    return c;
}

function buildCharacterMatrix(c, poseState) {
    const r0 = '.HHHHHHHHH.';
    const r1 = 'HHhHHHHhHHH';
    const r2 = 'HHhHHHHhHHH';
    const r3 = 'HSSSSSSSSSH';
    const r4 = 'SS.EE.EE.SS';
    const r5 = 'SS.EE.EE.SS';
    const r6 = '.SS.MMM.SS.';
    const r7 = '....SSS....';
    const r8 = '..TTCCCCTT.';
    const r9 = '.TT.CCCC.TT';
    const r10 = 'TT..CCCC..T';
    const r11 = 'SS..CCCC..S';

    let r12 = '..PPPPPPP..';
    let r13 = '..PPP.PPP..';
    let r14 = '..PPP.PPP..';
    let r15 = '..FF...FF..';

    if (poseState === 1) {
        r13 = '..PPPP.PP..';
        r14 = '..PPP..PP..';
        r15 = '..FF....FF.';
    } else if (poseState === 2) {
        r13 = '..PP.PPPP..';
        r14 = '..PP..PPP..';
        r15 = '.FF....FF..';
    } else if (poseState === 3) {
        return [
            r0, r1, r2, r3, r4, r5, r6,
            r7,
            '..TTCCCCTT.',
            '.TTTCCCCCTT',
            '..PPPPPPPP.',
            '.PPPPPPPPPP'
        ];
    }

    const grid = [r0, r1, r2, r3, r4, r5, r6, r7, r8, r9, r10, r11, r12, r13, r14, r15];

    const style = c.hairStyle % 5;
    if (style === 0) {
        grid[2] = 'HHHHHHHHHHH';
        grid[3] = 'HSSSSSSSSSH';
    } else if (style === 1) {
        grid[1] = 'HHh.HHh.HHH';
        grid[2] = 'HH.HHHH.HHH';
        grid[3] = 'HSSSSSSSSSH';
    } else if (style === 2) {
        grid[0] = '....HHH....';
        grid[1] = '.HHHHHHHHH.';
        grid[2] = 'HHhHHHHhHHH';
    } else if (style === 3) {
        for (let i = 3; i <= 10; i++) {
            const arr = grid[i].split('');
            arr[0] = 'H';
            arr[10] = 'H';
            grid[i] = arr.join('');
        }
    } else if (style === 4) {
        grid[0] = '..SSSSSSS..';
        grid[1] = '.SSSSSSSSS.';
        grid[2] = 'SSSSSSSSSSS';
    }

    return grid;
}

function buildCharacterSprite(c, poseState) {
    const out = OUTFIT_LIST[c.outfitId] || OUTFIT_LIST[0];
    const palette = {
        S: c.skin,
        H: c.hairColor || '#1a2c2e',
        h: c.hairShade || '#364d47',
        E: '#141716',
        M: '#f01e56',
        C: out.main,
        T: out.trim,
        P: out.pants,
        F: '#0f1211'
    };
    const grid = buildCharacterMatrix(c, poseState);
    return bakeRotmgSprite(grid, palette, 5, true);
}

function buildStaticMap(night) {
    if (cachedNight === night) return;
    cachedNight = night;
    const s = staticCtx;
    s.imageSmoothingEnabled = false;

    const tile = 32;
    for (let y = 210; y < MAP_H; y += tile) {
        for (let x = 0; x < MAP_W; x += tile) {
            const v = Math.sin(x * 0.0045) + Math.cos(y * 0.0045);

            s.fillStyle = night
                ? (v > 0.3 ? (alt ? '#192517' : '#152013') : (alt ? '#142916' : '#102212'))
                : (v > 0.3 ? (alt ? '#4c6638' : '#435b31') : (alt ? '#2e7d32' : '#266e2a'));
            s.fillRect(x, y, tile, tile);
        }
    }

    const skyH = 225;
    const skyGrad = s.createLinearGradient(0, 0, 0, skyH);

        skyGrad.addColorStop(0, '#0a101d');

        skyGrad.addColorStop(0, '#81c3f7');

    s.beginPath();
    s.moveTo(0, skyH); s.lineTo(0, 120); s.lineTo(260, 46); s.lineTo(580, 128);
    s.lineTo(940, 38); s.lineTo(1320, 110); s.lineTo(1680, 42); s.lineTo(MAP_W, 110);
    s.lineTo(MAP_W, skyH); s.closePath(); s.fill();

    const mistGrad = s.createLinearGradient(0, 95, 0, skyH + 24);

    mistGrad.addColorStop(0.65, night ? 'rgba(27,43,34,0.78)' : 'rgba(220,238,224,0.86)');
    mistGrad.addColorStop(1, night ? 'rgba(27,43,34,0)' : 'rgba(76,102,56,0)');
    s.fillStyle = mistGrad;
    s.fillRect(0, 95, MAP_W, skyH - 95 + 24);

    s.strokeStyle = night ? '#4a382e' : '#9e6b4b';
    s.lineWidth = 68;
    s.beginPath();
    s.moveTo(1000, 590);
    for (let y = 590; y <= 1580; y += 20) {
        const wx = (y > 1150 && y < 1330) ? 0 : Math.sin((y - 590) * 0.008) * 28;
        s.lineTo(1000 + wx, y);
    }
    s.stroke();

    s.fillStyle = night ? '#143f59' : '#4682be';
    s.beginPath();
    s.moveTo(0, getRiverY(0) - RIVER_HALF);
    for (let x = 0; x <= MAP_W; x += 24) s.lineTo(x, getRiverY(x) - RIVER_HALF);
    for (let x = MAP_W; x >= 0; x -= 24) s.lineTo(x, getRiverY(x) + RIVER_HALF);
    s.closePath(); s.fill();

    const by = getRiverY(BRIDGE_X);
    s.fillStyle = night ? '#3e2723' : '#6d4c41';
    s.fillRect(BRIDGE_X - 50, by - RIVER_HALF - 10, 100, RIVER_HALF * 2 + 20);
    s.strokeStyle = '#111'; s.lineWidth = 3;
    s.strokeRect(BRIDGE_X - 50, by - RIVER_HALF - 10, 100, RIVER_HALF * 2 + 20);

    s.save();
    s.translate(POND.x, POND.y);
    s.fillStyle = night ? '#263228' : '#68785a';
    s.beginPath(); s.arc(0, 0, POND.r + 10, 0, Math.PI, false); s.closePath(); s.fill();
    s.fillStyle = night ? '#123c54' : '#3a7bb8';
    s.strokeStyle = '#141c14'; s.lineWidth = 4;
    s.beginPath(); s.arc(0, 0, POND.r, 0, Math.PI, false); s.closePath(); s.fill(); s.stroke();
    s.restore();

    FLOWERS.forEach(f => {
        if (Math.abs(f.y - getRiverY(f.x)) < RIVER_HALF + 18) return;
        if (f.y >= POND.y - 12 && Math.hypot(f.x - POND.x, f.y - POND.y) < POND.r + 18) return;

function drawPondKoi(ctx, time, night) {

        ctx.fillStyle = '#0c0e0c'; ctx.fillRect(-7, -3, 14, 6);

}

const spriteCache = new Map();

function getCharKey(name, c) {

function getCharacterFrames(name, c) {
    const key = getCharKey(name, c);
    if (spriteCache.has(key)) return spriteCache.get(key);
    if (spriteCache.size >= MAX_CACHE) {
        spriteCache.delete(spriteCache.keys().next().value);
    }

    const frames = [0, 1, 2, 3].map(pose => {
        const spr = buildCharacterSprite(c, pose);
        const cv = document.createElement('canvas');
        cv.width = 180;
        cv.height = 120;
        const cx = cv.getContext('2d');
        cx.imageSmoothingEnabled = false;

        cx.fillStyle = 'rgba(0, 0, 0, 0.42)';
        cx.beginPath();
        cx.ellipse(90, 94, pose === 3 ? 25 : 18, 6, 0, 0, Math.PI * 2);
        cx.fill();

        const bob = (pose === 1 || pose === 2) ? -2 : 0;
        const topY = Math.round(94 - spr.height + bob);
        cx.drawImage(spr, Math.round(90 - spr.width / 2), topY);

        if (name) {
            const nameY = Math.max(14, topY - 8);
            cx.font = 'bold 11px "Courier New", monospace';
            cx.textAlign = 'center';
            cx.strokeStyle = '#0c0e0c';
            cx.lineWidth = 3;
            cx.strokeText(name, 90, nameY);
            cx.fillStyle = '#ffeb3b';
            cx.fillText(name, 90, nameY);
        }
        return cv;
    });

    spriteCache.set(key, frames);
    return frames;
}

function drawEntity(ctx, x, y, name, c, med, walk, chat, time) {
    const rx = Math.round(x);
    const ry = Math.round(y);

    if (med) {
        const pulse = 0.45 + Math.sin(time * 0.004) * 0.2;
        const rad = 36 + Math.sin(time * 0.003) * 3;
        const grad = ctx.createRadialGradient(rx, ry - 12, 4, rx, ry - 12, rad);
        grad.addColorStop(0, `rgba(255, 245, 157, ${pulse})`);
        grad.addColorStop(1, 'rgba(255, 245, 157, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(rx, ry - 12, rad, 0, Math.PI * 2); ctx.fill();
    }

    const frames = getCharacterFrames(name, c);
    let idx = 0;
    if (med) idx = 3;
    else if (walk > 0.01) idx = (Math.sin(walk) >= 0) ? 1 : 2;

    ctx.drawImage(frames[idx], rx - 90, ry - 94);

    if (chat) {
        ctx.font = '11px "Courier New", monospace';
        ctx.textAlign = 'center';
        const w = Math.max(ctx.measureText(chat).width + 14, 36);
        const by = ry - 118;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.strokeStyle = '#0c0e0c'; ctx.lineWidth = 2;
        ctx.fillRect(Math.round(rx - w / 2), by, Math.round(w), 20);
        ctx.strokeRect(Math.round(rx - w / 2), by, Math.round(w), 20);
        ctx.fillStyle = '#111';
        ctx.fillText(chat, rx, by + 14);
    }
}

const ROOM_ID = 'thienvien_v62_room_2026';
const MAX_PEERS = 24;
const MAX_VISIBLE = 280;
let peer = null;
const conns = {};
const remotes = {};
const profiles = {};
let syncTimer = null;
let lastSig = '';
let tickCount = 0;

function createPeerInstance(customId = null) {
    const iceCfg = {
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        }
    };
    const p = customId ? new Peer(customId, iceCfg) : new Peer(iceCfg);
    p.on('open', () => {
        updateOnlineHUD();
        if (p.id !== ROOM_ID) linkPeer(ROOM_ID);
        beginSync();
    });
    p.on('disconnected', () => {
        try { if (!p.destroyed) p.reconnect(); } catch (_) {}
    });
    p.on('error', err => {
        if (err && err.type === 'unavailable-id' && customId) {
            try { p.destroy(); } catch (_) {}
            peer = createPeerInstance(null);
        } else {
            updateOnlineHUD();
            beginSync();
        }
    });
    p.on('connection', bindConn);
    return p;
}

function initP2P() {
    if (typeof Peer === 'undefined') { updateOnlineHUD(); return; }
    peer = createPeerInstance(ROOM_ID);
}

function linkPeer(id) {
    if (!id || !peer || peer.destroyed || conns[id] || id === peer.id) return;
    if (Object.keys(conns).length >= MAX_PEERS) return;
    try { bindConn(peer.connect(id, { reliable: false })); } catch (_) {}
}

function sendProfile(targetConn = null) {
    if (!peer || !peer.id) return;
    const pkt = { t: 'P', id: peer.id, n: myName, c: cfg };
    if (targetConn && targetConn.open) targetConn.send(pkt);
    else {
        for (const k in conns) if (conns[k] && conns[k].open) conns[k].send(pkt);
    }
}

function bindConn(conn) {
    conns[conn.peer] = conn;
    conn.on('open', () => {
        updateOnlineHUD();
        sendProfile(conn);
        const peers = Object.keys(conns).filter(id => id !== conn.peer);
        if (peers.length > 0) conn.send({ t: 'L', list: peers.slice(0, 12) });
    });
    conn.on('data', d => {
        if (!d || !d.t) return;
        if (d.t === 'L' && Array.isArray(d.list)) {
            d.list.forEach(id => { if (Object.keys(conns).length < MAX_PEERS) linkPeer(id); });
        } else if (d.t === 'P') {
            const first = !profiles[d.id];
            profiles[d.id] = { n: d.n || 'Hành Giả', c: d.c || cfg };
            if (remotes[d.id]) {
                remotes[d.id].name = profiles[d.id].n;
                remotes[d.id].cfg = profiles[d.id].c;
            }
            if (first) relay(d, conn.peer);
        } else if (d.t === 'M') {
            const pr = profiles[d.id] || { n: 'Hành Giả', c: cfg };
            let rp = remotes[d.id];
            if (!rp) {
                rp = {
                    id: d.id, name: pr.n, cfg: pr.c,
                    x: d.x, y: d.y, tx: d.x, ty: d.y,
                    med: !!(d.f & 1), walk: 0, chat: d.ch || '',
                    lastSeen: Date.now()
                };
                remotes[d.id] = rp;
                if (!profiles[d.id] && conn.open) conn.send({ t: 'QP', target: d.id });
            } else {
                rp.tx = d.x; rp.ty = d.y;
                rp.med = !!(d.f & 1);
                rp.chat = d.ch || '';
                rp.lastSeen = Date.now();
            }
            const hop = (d.h || 0) + 1;
            if (hop <= 3) relay(Object.assign({}, d, { h: hop }), conn.peer);
            updateOnlineHUD();
        } else if (d.t === 'QP') {
            if (d.target === peer.id) sendProfile(conn);
            else if (profiles[d.target] && conn.open) {
                const p = profiles[d.target];
                conn.send({ t: 'P', id: d.target, n: p.n, c: p.c });
            }
        }
    });
    conn.on('close', () => {
        delete conns[conn.peer];
        updateOnlineHUD();
    });
    conn.on('error', () => {
        delete conns[conn.peer];
        updateOnlineHUD();
    });
}

function relay(pkt, exceptId) {
    for (const k in conns) {
        if (k !== exceptId && conns[k] && conns[k].open) conns[k].send(pkt);
    }
}

function beginSync() {
    if (syncTimer) return;
    syncTimer = setInterval(() => {
        if (!peer || peer.destroyed || !peer.id) return;
        if (peer.disconnected) {
            try { peer.reconnect(); } catch (_) {}
        }
        tickCount++;
        const flags = (isMeditating ? 1 : 0) | ((!isMeditating && walkPhase > 0) ? 2 : 0);
        const rx = Math.round(myX), ry = Math.round(myY);
        const sig = `${rx},${ry},${flags},${chatMsg}`;
        if (sig !== lastSig || tickCount % 5 === 0) {
            lastSig = sig;
            const pkt = { t: 'M', id: peer.id, x: rx, y: ry, f: flags, ch: chatMsg, h: 0 };
            for (const k in conns) if (conns[k] && conns[k].open) conns[k].send(pkt);
        }

        const now = Date.now();
        let changed = false;
        for (const id in remotes) {
            if (now - remotes[id].lastSeen > 25000) {
                delete remotes[id];
                changed = true;
            }
        }
        if (changed) updateOnlineHUD();

        if (peer.id !== ROOM_ID && (!conns[ROOM_ID] || !conns[ROOM_ID].open)) {
            if (conns[ROOM_ID]) delete conns[ROOM_ID];
            linkPeer(ROOM_ID);
        }
    }, 200);
}

function updateOnlineHUD() {
    document.getElementById('hud-online').textContent = '● ' + (1 + Object.keys(remotes).length);
}

function stepSimulation() {
    if (!isMeditating) {
        let vx = 0, vy = 0;
        const spd = 3.4;
        if (keys['w'] || keys['arrowup']) vy -= 1;
        if (keys['s'] || keys['arrowdown']) vy += 1;
        if (keys['a'] || keys['arrowleft']) vx -= 1;
        if (keys['d'] || keys['arrowright']) vx += 1;

        if (vx !== 0 || vy !== 0) {
            const len = Math.hypot(vx, vy);
            vx = (vx / len) * spd; vy = (vy / len) * spd;
            if (canMove(myX + vx, myY)) myX += vx;
            if (canMove(myX, myY + vy)) myY += vy;
            targetX = myX; targetY = myY;
            walkPhase += 0.24;
        } else {
            const dx = targetX - myX, dy = targetY - myY, dist = Math.hypot(dx, dy);
            if (dist > spd) {
                const mx = (dx / dist) * spd, my = (dy / dist) * spd;
                if (canMove(myX + mx, myY)) myX += mx;
                if (canMove(myX, myY + my)) myY += my;
                walkPhase += 0.24;
            } else {
                walkPhase = 0;
            }
        }
    }

    for (const id in remotes) {
        const rp = remotes[id];
        const dx = rp.tx - rp.x, dy = rp.ty - rp.y;
        if (Math.abs(dx) > 0.4 || Math.abs(dy) > 0.4) {
            rp.x += dx * 0.24;
            rp.y += dy * 0.24;
            rp.walk += 0.22;
        } else {
            rp.x = rp.tx; rp.y = rp.ty; rp.walk = 0;
        }
    }

    if (chatTicks > 0) { chatTicks--; if (chatTicks === 0) chatMsg = ''; }
}

const renderList = [];
let fpsFrames = 0, fpsLast = performance.now(), fpsVal = 60;

function loop(time) {
    syncCanvasResolution();

    fpsFrames++;
    if (time - fpsLast >= 1000) {
        fpsVal = fpsFrames;
        fpsFrames = 0;
        fpsLast = time;
        document.getElementById('hud-fps').textContent = fpsVal + ' FPS';
    }

    const vn = getVNTime();
    const night = isNight(vn);
    document.getElementById('hud-clock').textContent =
        String(vn.getHours()).padStart(2, '0') + ':' + String(vn.getMinutes()).padStart(2, '0');

    stepSimulation();
    buildStaticMap(night);

    ctx.fillStyle = '#0c0e0c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const camX = Math.floor(canvas.width / 2 - myX);
    const camY = Math.floor(canvas.height / 2 - myY);
    const left = -camX, top = -camY, right = left + canvas.width, bottom = top + canvas.height;

    ctx.save();
    ctx.translate(camX, camY);

    const sx = Math.max(0, left), sy = Math.max(0, top);
    const sw = Math.min(MAP_W, right) - sx, sh = Math.min(MAP_H, bottom) - sy;
    if (sw > 0 && sh > 0) ctx.drawImage(staticCanvas, sx, sy, sw, sh, sx, sy, sw, sh);

    drawPondKoi(ctx, time, night);

    if (!isMeditating && (Math.abs(targetX - myX) > 3 || Math.abs(targetY - myY) > 3)) {
        ctx.strokeStyle = '#f4d03f';
        ctx.lineWidth = 2;
        ctx.strokeRect(Math.round(targetX) - 7, Math.round(targetY) - 7, 14, 14);
    }

    renderList.length = 0;
    renderList.push({ x: myX, y: myY, name: myName, cfg, med: isMeditating, walk: walkPhase, chat: chatMsg });
    for (const id in remotes) {
        const rp = remotes[id];
        if (rp.x >= left - 90 && rp.x <= right + 90 && rp.y >= top - 110 && rp.y <= bottom + 90) {
            renderList.push(rp);
            if (renderList.length >= MAX_VISIBLE) break;
        }
    }
    renderList.sort((a, b) => a.y - b.y);

    for (let i = 0; i < renderList.length; i++) {
        const e = renderList[i];
        drawEntity(ctx, e.x, e.y, e.name, e.cfg, e.med, e.walk, e.chat, time);
    }

    ctx.restore();
    requestAnimationFrame(loop);
}

initCreatorUI();
requestAnimationFrame(loop);
</script>
